<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Herndon Financial OS — Phase 2 Test</title>
<style>
:root{
  --bg:#f5f6f8;--surface:#fff;--surface2:#f9fafb;--surface3:#eef2f6;
  --ink:#111827;--muted:#6b7280;--muted2:#9ca3af;--line:#e5e7eb;--line2:#d1d5db;
  --navy:#0f2742;--navy2:#15385c;--blue:#2563eb;--blueSoft:#eff6ff;
  --green:#047857;--greenSoft:#ecfdf5;--amber:#b45309;--amberSoft:#fffbeb;
  --red:#b91c1c;--redSoft:#fef2f2;--violet:#6d28d9;--violetSoft:#f5f3ff;
  --shadow:0 1px 2px rgba(15,23,42,.06),0 8px 24px rgba(15,23,42,.06);--radius:16px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums;overflow-x:hidden;min-height:100vh}
/* App shell */
.app{display:grid;grid-template-columns:256px 1fr;min-height:100vh}
.sidebar{background:linear-gradient(180deg,var(--navy),#0b1b2d);color:white;padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;overflow-y:auto}
.brand{display:flex;gap:10px;align-items:center;margin-bottom:26px}
.logo{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,#8ab4ff,#fff);color:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px;flex-shrink:0}
.brand-text h1{font-size:13px;font-weight:700;line-height:1.25;letter-spacing:.02em}
.brand-text p{font-size:10px;color:rgba(255,255,255,.5);margin-top:2px}
.nav-label{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:rgba(255,255,255,.35);margin:14px 0 5px 10px}
.nav-item{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:10px;color:rgba(255,255,255,.7);font-size:13px;margin-bottom:3px;cursor:pointer;transition:background .1s;border:none;background:none;width:100%;text-align:left;font-family:inherit}
.nav-item:hover{background:rgba(255,255,255,.09);color:#fff}
.nav-item.active{background:rgba(255,255,255,.13);color:#fff;font-weight:600}
.nav-icon{font-size:14px;width:18px;text-align:center;flex-shrink:0}
.nav-pill{font-size:10px;color:#dbeafe;background:rgba(96,165,250,.2);border:1px solid rgba(147,197,253,.25);padding:2px 7px;border-radius:99px;margin-left:auto}
.sidebar-footer{margin-top:auto;padding-top:14px;border-top:1px solid rgba(255,255,255,.1)}
.model-card{padding:11px 13px;border-radius:11px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1)}
.model-card .mc-title{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:rgba(255,255,255,.4);margin-bottom:6px}
.model-card p{font-size:11px;line-height:1.5;color:rgba(255,255,255,.68)}
/* Main */
.main{min-width:0;overflow-x:hidden;display:flex;flex-direction:column;height:100vh;overflow-y:auto}
.topbar{height:62px;background:rgba(255,255,255,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 26px;position:sticky;top:0;z-index:20;flex-shrink:0}
.top-title h2{font-size:15px;font-weight:700;margin:0}
.top-title p{font-size:11px;color:var(--muted);margin:2px 0 0}
.top-right{display:flex;gap:9px;align-items:center}
.sync-badge{display:flex;gap:7px;align-items:center;font-size:11px;color:var(--muted);padding:7px 11px;border:1px solid var(--line);background:var(--surface2);border-radius:99px}
.sync-dot{width:7px;height:7px;border-radius:99px;background:var(--green)}
.topbar-action-btn{font-size:11px;font-weight:600;padding:5px 12px;border-radius:99px;border:1px solid var(--line2);background:var(--surface2);color:var(--ink);cursor:pointer;font-family:inherit;transition:all .1s}
.topbar-action-btn:hover{background:var(--surface3)}
.topbar-action-btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
.topbar-action-btn.primary:hover{background:#1d4ed8}
.content{padding:22px 26px 80px;flex:1}
.section{display:none}.section.active{display:block}
/* Panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);min-width:0}
.card-pad{padding:18px}
.panel-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}
.panel-title h3{margin:0;font-size:14px;font-weight:700}
.panel-title .mini{font-size:11px;color:var(--muted)}
/* Overview */
.ov-hero{display:grid;grid-template-columns:1.2fr .9fr;gap:15px;margin-bottom:15px}
.sys-panel{padding:20px}
.status-badge{display:inline-flex;align-items:center;gap:7px;background:var(--greenSoft);color:var(--green);border:1px solid #a7f3d0;padding:5px 11px;border-radius:99px;font-weight:700;font-size:11px;letter-spacing:.04em}
.sys-panel h3{font-size:20px;line-height:1.2;margin:9px 0 6px;font-weight:700}
.sys-panel .sub{font-size:12px;color:var(--muted);line-height:1.55}
.health-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-bottom:15px}
.health-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px;box-shadow:var(--shadow)}
.health-label{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:6px}
.health-value{font-size:19px;font-weight:800}
.health-value.good{color:var(--green)}.health-value.warn{color:var(--amber)}.health-value.risk{color:var(--red)}
.health-hint{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.4}
.health-hint.good{color:var(--green)}.health-hint.watch{color:var(--amber)}
.alert-panel{padding:16px}
.alert-panel h4{margin:0 0 11px;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.risk-item{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:flex-start}
.risk-item:first-of-type{border-top:none;padding-top:0}
.risk-icon{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:var(--amberSoft);color:var(--amber);font-weight:900;font-size:13px;flex-shrink:0}
.risk-icon.blue{background:var(--blueSoft);color:var(--blue)}.risk-icon.green{background:var(--greenSoft);color:var(--green)}.risk-icon.violet{background:var(--violetSoft);color:var(--violet)}
.risk-title{font-size:12px;font-weight:700}.risk-meta{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.4}
/* Timeline */
.timelineForecastPanel{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:15px;margin-bottom:15px}
.timelineCard{overflow:hidden}
.timeline-header{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 0;margin-bottom:9px}
.timeline-header h3{font-size:14px;font-weight:700;margin:0}
.timeline-header span{font-size:11px;color:var(--muted)}
.timelineWrap{max-width:100%;overflow-x:auto;overflow-y:hidden;padding:2px 16px 12px;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;scrollbar-width:thin}
.timeline{display:flex;width:max-content;min-width:100%;gap:5px;padding:4px 2px 2px}
.weekChip{min-width:50px;height:48px;border-radius:11px;border:1px solid var(--line);background:var(--surface2);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative;transition:all .1s;flex-shrink:0}
.weekChip:hover{border-color:var(--blue);background:var(--blueSoft)}
.weekChip .n{font-weight:700;font-size:12px}.weekChip .d{font-size:9px;color:var(--muted);margin-top:1px}
.weekChip.active{border-color:var(--blue);background:var(--blueSoft);box-shadow:inset 0 0 0 1px var(--blue)}
.weekChip.current:not(.active){border-color:var(--amber);background:var(--amberSoft)}
.weekChip.trough:not(.active):not(.current){border-color:#fbbf24;background:var(--amberSoft)}
.weekChip.managed:not(.active){border-color:var(--red);background:var(--redSoft)}
.weekChip.reconciled::after{content:"";position:absolute;right:5px;top:5px;width:6px;height:6px;border-radius:99px;background:var(--green)}
.weekChip.openActions::before{content:"";position:absolute;left:5px;top:5px;width:6px;height:6px;border-radius:99px;background:var(--amber)}
.weekChip.edited .n{color:var(--violet)}.weekChip.custom{border-style:dashed}
.timeline-insight-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;padding:9px 16px 16px}
.t-insight{background:var(--surface2);border:1px solid var(--line);border-radius:11px;padding:10px 12px}
.t-insight .label{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:3px}
.t-insight .val{font-size:13px;font-weight:700}.t-insight .meta{font-size:11px;color:var(--muted);margin-top:2px}
.timeline-legend{display:flex;gap:12px;flex-wrap:wrap;padding:0 16px 14px}
.legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted)}
.legend-dot{width:9px;height:9px;border-radius:3px;flex-shrink:0}
.goal-forecast-rail{padding:16px}
.goal-forecast-rail h3{font-size:14px;font-weight:700;margin:0 0 13px}
.progress-goal{margin-bottom:14px}
.progress-goal:last-child{margin-bottom:0}
.goal-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px}
.goal-top .name{font-size:13px;font-weight:700}.goal-top .value{font-size:12px;color:var(--muted)}
.prog-bar{height:8px;background:var(--surface3);border-radius:99px;overflow:hidden}
.prog-fill{height:100%;border-radius:99px;transition:width .5s ease}
.goal-meta{display:flex;justify-content:space-between;margin-top:5px;font-size:11px;color:var(--muted)}
/* Weekly */
.weekly-grid{display:grid;grid-template-columns:266px 1fr;gap:15px}
.week-list-panel{padding:14px;max-height:calc(100vh - 100px);overflow-y:auto;position:sticky;top:78px}
.week-list-panel h3{font-size:13px;font-weight:700;margin:0 0 9px}
.week-list{display:grid;gap:5px}
.week-list-item{display:grid;grid-template-columns:36px 1fr auto;gap:8px;align-items:center;padding:9px 10px;border:1px solid var(--line);border-radius:11px;background:var(--surface2);cursor:pointer;transition:all .1s}
.week-list-item:hover{border-color:var(--blue);background:var(--blueSoft)}
.week-list-item.active{background:var(--blueSoft);border-color:#bfdbfe}
.week-list-item.now-item{border-left:3px solid var(--blue)}
.week-list-item.reconciled-item:not(.active){background:var(--greenSoft)}
.wli-num-wrap{display:flex;flex-direction:column;align-items:center;gap:3px}
.wli-dot{width:6px;height:6px;border-radius:99px}
.wli-dot.none{display:none}
.wli-dot.current{background:var(--blue)}
.wli-dot.trough{background:var(--amber)}
.wli-dot.managed{background:var(--red)}
.wli-dot.reconciled{background:var(--green)}
.wli-dot.edited{background:var(--violet)}
.wl-legend{display:flex;flex-wrap:wrap;gap:8px 12px;padding:10px 2px 6px;border-top:1px solid var(--line);margin-top:8px}
.wl-leg-item{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--muted);white-space:nowrap}
.wl-leg-dot{width:8px;height:8px;border-radius:99px;flex-shrink:0}
.wl-leg-dot.current{background:var(--blue)}
.wl-leg-dot.trough{background:var(--amber)}
.wl-leg-dot.managed{background:var(--red)}
.wl-leg-dot.reconciled{background:var(--green)}
.week-list-item.trough-item{border-left:3px solid var(--amber)}
.week-list-item.managed-item{border-left:3px solid var(--red)}
.wli-num{font-size:12px;font-weight:900;color:var(--navy);text-align:center}
.wli-name{font-size:12px;font-weight:700}.wli-dates{font-size:10px;color:var(--muted);margin-top:1px}
.wli-badge{font-size:9px;text-transform:uppercase;letter-spacing:.07em;border-radius:99px;padding:3px 6px;font-weight:700;white-space:nowrap}
.wli-badge.ok{background:var(--greenSoft);color:var(--green)}.wli-badge.watch{background:var(--amberSoft);color:var(--amber)}
.wli-badge.risk{background:var(--redSoft);color:var(--red)}.wli-badge.now{background:var(--blueSoft);color:var(--blue)}
.wli-badge.past{background:var(--surface3);color:var(--muted2)}
.add-week-btn-new{display:flex;align-items:center;justify-content:center;height:38px;border:2px dashed var(--line2);border-radius:11px;background:transparent;color:var(--muted);cursor:pointer;font-size:12px;transition:all .12s;margin-top:5px;font-family:inherit;width:100%}
.add-week-btn-new:hover{border-color:var(--blue);color:var(--blue);background:var(--blueSoft)}
.week-detail{display:grid;gap:13px}
.wk-header-card{padding:18px}
.wk-header-top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
.wk-header-top h2{font-size:20px;font-weight:700;margin:0}
.wk-header-top p{font-size:12px;color:var(--muted);margin:4px 0 0;font-style:italic}
.wk-badge-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.wk-action-row{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
/* Badges */
.badge{font-size:10px;padding:3px 9px;border-radius:20px;font-weight:600;white-space:nowrap;letter-spacing:.03em;display:inline-block}
.badge-trough{background:var(--amberSoft);color:var(--amber);border:1px solid #fde68a}
.badge-managed{background:var(--redSoft);color:var(--red);border:1px solid #fca5a5}
.badge-recon{background:var(--greenSoft);color:var(--green);border:1px solid #86efac}
.badge-now{background:#fef3c7;color:#92400e;border:1px solid #fde68a}
.badge-past{background:var(--surface3);color:var(--muted2);border:1px solid var(--line2)}
.badge-op{background:var(--blueSoft);color:var(--blue);border:1px solid #bfdbfe}
.badge-edited{background:var(--violetSoft);color:var(--violet);border:1px solid #c4b5fd}
/* Buttons */
.btn{border:1px solid var(--line2);background:var(--surface);color:var(--ink);padding:7px 12px;border-radius:9px;font-size:12px;cursor:pointer;font-family:inherit;transition:all .1s}
.btn:hover{background:var(--surface3)}
.btn.primary{background:var(--navy2);border-color:var(--navy2);color:white}
.btn.primary:hover{background:var(--navy)}
/* Week alerts */
.week-alert{border-radius:9px;padding:10px 13px;font-size:12px;margin-bottom:4px;line-height:1.55}
.alert-trough{background:var(--amberSoft);border:1px solid #fde68a;color:var(--amber)}
.alert-managed{background:var(--redSoft);border:1px solid #fca5a5;color:var(--red)}
/* Cashflow */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.sect{font-size:10px;font-weight:700;color:var(--muted2);text-transform:uppercase;letter-spacing:.07em;margin-bottom:6px;margin-top:13px;border-bottom:1px solid var(--line);padding-bottom:3px}
.sect:first-child{margin-top:0}
.ev-row{display:flex;justify-content:space-between;padding:5px 0;font-size:12.5px;border-bottom:1px solid var(--line);align-items:flex-start;gap:8px}
.ev-row:last-child{border-bottom:none}
.ev-lbl{color:var(--muted);flex:1;line-height:1.4}
.ev-in{font-weight:700;color:var(--green);min-width:80px;text-align:right;flex-shrink:0}
.ev-out{font-weight:700;color:var(--red);min-width:80px;text-align:right;flex-shrink:0}
.xfr-row{display:flex;gap:9px;padding:5px 0;font-size:12px;align-items:flex-start;border-bottom:1px solid var(--line)}
.xfr-row:last-child{border-bottom:none}
.xi{font-size:14px;flex-shrink:0;margin-top:1px}
.xtext{flex:1}.xlbl{color:var(--ink);font-size:12.5px;line-height:1.4}
.xrsn{color:var(--muted2);font-size:10.5px;margin-top:2px;font-style:italic}
/* Balance table */
.bal-table{width:100%;border-collapse:collapse}
.bal-table th{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);text-align:right;padding:8px 9px;border-bottom:1px solid var(--line);font-weight:600}
.bal-table th:first-child{text-align:left}
.bal-table td{font-size:13px;text-align:right;padding:9px 9px;border-bottom:1px solid var(--line)}
.bal-table td:first-child{text-align:left;font-weight:700}
.bal-table tr:last-child td{border-bottom:none}
.var-neg{color:var(--red);font-weight:700}.var-pos{color:var(--green);font-weight:700}.var-ok{color:var(--muted2)}
.liq-row{background:var(--blueSoft);border:1px solid #bfdbfe;border-radius:9px;padding:10px 13px;display:flex;justify-content:space-between;align-items:center;margin-top:11px}
.liq-label{font-size:12px;color:var(--blue);font-weight:600}.liq-val{font-size:15px;font-weight:700;color:var(--blue)}
/* Variance */
.variance-alert{background:#fff7ed;border:1px solid #fed7aa;border-left:4px solid #ea580c;border-radius:9px;padding:10px 13px;margin-top:11px}
.variance-title{font-size:11px;font-weight:700;color:#c2410c;margin-bottom:6px}
.variance-items{display:flex;flex-wrap:wrap;gap:6px}
.vitem{padding:3px 10px;border-radius:12px;font-size:11px;font-weight:600}
.vitem.under{background:var(--redSoft);color:var(--red)}.vitem.over{background:var(--greenSoft);color:var(--green)}
/* Tasks */
.acts{padding-top:11px}
.act-hdr{font-size:10px;font-weight:700;color:var(--muted2);text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.act-progress{font-size:10px;font-weight:400;font-style:italic;color:var(--muted2)}
.act-progress.all-done{color:var(--green)}.act-progress.partial{color:var(--amber)}
.task-row{display:flex;gap:9px;align-items:flex-start;padding:7px 9px;border:1px solid var(--line);border-radius:9px;margin-bottom:5px;background:var(--surface2)}
.task-row:last-child{margin-bottom:0}
.task-check{width:18px;height:18px;flex-shrink:0;cursor:pointer;accent-color:var(--green);margin-top:2px}
.task-text{flex:1;font-size:12.5px;color:var(--ink);line-height:1.4}
.task-text.done{text-decoration:line-through;color:var(--muted2)}.rec-row{display:flex;gap:9px;align-items:flex-start;padding:7px 9px;border:1px dashed var(--line);border-radius:9px;margin-bottom:5px;background:var(--bg);opacity:.9}.rec-row:last-child{margin-bottom:0}.rec-icon{font-size:13px;flex-shrink:0;margin-top:1px}.rec-text{flex:1;font-size:12px;color:var(--muted2);line-height:1.4}
/* Notes */
.notes-hdr{font-size:10px;font-weight:700;color:var(--muted2);text-transform:uppercase;letter-spacing:.07em;margin-bottom:6px}
.notes-area{width:100%;padding:9px 11px;border:1px solid var(--line2);border-radius:9px;font-size:13px;font-family:inherit;color:var(--ink);background:var(--surface);resize:vertical;min-height:60px;line-height:1.5;display:block}
.notes-area:focus{outline:2px solid var(--blue);border-color:var(--blue)}
.notes-saved{font-size:10px;color:var(--green);margin-top:4px;height:14px;font-style:italic}
/* Recon */
.recon-done-row{display:flex;align-items:center;gap:8px;background:var(--greenSoft);border:1px solid #86efac;border-radius:9px;padding:9px 12px;font-size:12px;color:var(--green)}
.recon-done-lbl{flex:1;font-weight:600}
.recon-edit-btn{font-size:11px;color:var(--blue);cursor:pointer;background:none;border:none;font-family:inherit;text-decoration:underline;padding:0}
.recon-open-btn{width:100%;padding:9px 14px;border:1px dashed var(--line2);border-radius:9px;background:var(--surface);color:var(--muted);cursor:pointer;font-size:12px;font-family:inherit;transition:all .12s;text-align:center}
.recon-open-btn:hover{background:var(--blueSoft);border-color:var(--blue);color:var(--blue);border-style:solid}
.recon-form{background:var(--surface2);border:1px solid var(--line2);border-radius:11px;padding:13px;margin-top:9px}
.recon-form-title{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:9px}
.recon-inputs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:11px}
.recon-field label{font-size:10px;color:var(--muted2);text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:3px}
.recon-input{width:100%;padding:7px 9px;border:1px solid var(--line2);border-radius:7px;font-size:14px;font-family:inherit;background:var(--surface);color:var(--ink)}
.recon-input:focus{outline:2px solid var(--blue);border-color:var(--blue)}
.recon-btn-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.recon-save{padding:8px 17px;background:var(--blue);color:white;border:none;border-radius:8px;font-size:13px;font-family:inherit;cursor:pointer;font-weight:600}
.recon-save:hover{background:#1d4ed8}
.recon-cancel{padding:8px 13px;background:var(--surface);color:var(--muted);border:1px solid var(--line2);border-radius:8px;font-size:13px;font-family:inherit;cursor:pointer}
.recon-delete{padding:8px 13px;background:var(--surface);color:var(--red);border:1px solid #fca5a5;border-radius:8px;font-size:13px;font-family:inherit;cursor:pointer;margin-left:auto}
.recon-hint{font-size:10px;color:var(--muted2);font-style:italic}
/* Banners */
.banner{border-radius:9px;padding:9px 13px;font-size:12px;font-weight:600;text-align:center}
.banner-green{background:var(--greenSoft);color:var(--green);border:1px solid #86efac}
.banner-blue{background:var(--blueSoft);color:var(--blue);border:1px solid #93c5fd}
.banner-amber{background:var(--amberSoft);color:var(--amber);border:1px solid #fde68a}
.wk-title-nav{display:flex;align-items:center;gap:6px}
.wnav-arrow{width:30px;height:30px;border:1px solid var(--line2);border-radius:8px;background:var(--surface);color:var(--muted);cursor:pointer;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;transition:all .12s;font-family:inherit;flex-shrink:0;padding:0}
.wnav-arrow:hover{background:var(--blue);color:white;border-color:var(--blue)}
.wnav-arrow-ph{width:30px;height:30px;flex-shrink:0}
/* Goals */
.goals-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-bottom:15px}
.goal-card{padding:20px;position:relative}
.goal-card h3{font-size:16px;font-weight:700;margin:0 0 4px}
.goal-card .sub{font-size:12px;color:var(--muted);margin:0 0 13px;line-height:1.45}
.goal-amount{font-size:24px;font-weight:800;margin-bottom:5px}
.goal-input-row{display:flex;align-items:center;gap:8px;margin-bottom:13px}
.goal-input-label{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.ginput-wrap{display:flex;align-items:center;gap:4px}
.ginput-wrap span{font-size:14px;color:var(--muted)}
.goal-inp{font-size:15px;font-weight:700;padding:5px 8px;border:1px solid var(--line2);border-radius:8px;background:var(--surface2);color:var(--ink);width:130px;font-family:inherit}
.goal-inp:focus{outline:2px solid var(--blue);border-color:var(--blue)}
.goal-priority{position:absolute;right:16px;top:16px;font-size:10px;font-weight:700;color:var(--blue);background:var(--blueSoft);border-radius:99px;padding:4px 9px}
.goal-forecast-card{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin-top:11px;font-size:12px;color:var(--muted);line-height:1.55}
.goal-forecast-card strong{color:var(--ink)}
.forecast-label{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--blueSoft);color:var(--blue);border-radius:4px;padding:1px 5px;margin-right:4px;vertical-align:middle}
/* History */
.history-summary{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:13px 17px;margin-bottom:13px;font-size:12.5px;color:var(--muted);line-height:1.6;box-shadow:var(--shadow)}
.hcard{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:14px 17px;margin-bottom:9px;box-shadow:var(--shadow)}
.hcard.past-open{border-left:3px solid var(--amber)}
.hcard.past-recon{border-left:3px solid var(--green)}
.hcard.current{border-left:3px solid var(--blue);border-top:2px solid var(--blue)}
.hcard.future{opacity:.6}
.hcard-hdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:9px}
.hcard-title{font-size:14px;font-weight:700}.hcard-dates{font-size:11px;color:var(--muted2);font-style:italic;margin-top:1px}
.hcard-status{font-size:11px;font-weight:600;flex-shrink:0}
.hcard-bals{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:8px}
.hcard-bal{font-size:10px}.hbal-name{color:var(--muted2);text-transform:uppercase;letter-spacing:.03em;margin-bottom:2px}
.hbal-val{font-weight:700;font-size:11px;color:var(--muted)}.hbal-actual{font-weight:700;font-size:11px;color:var(--ink)}
.hbal-var{font-size:9px;font-weight:700;display:block;margin-top:1px}
.hbal-var.under{color:var(--red)}.hbal-var.over{color:var(--green)}.hbal-var.ok{color:var(--muted2)}
.hcard-footer{display:flex;gap:11px;align-items:center;padding-top:8px;border-top:1px solid var(--line);flex-wrap:wrap}
.hcard-tasks{font-size:11px;font-weight:600}.hcard-tasks.done{color:var(--green)}.hcard-tasks.partial{color:var(--amber)}.hcard-tasks.none{color:var(--muted2)}
.hcard-note{font-size:11px;color:var(--muted);font-style:italic;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hcard-jump{font-size:11px;color:var(--blue);cursor:pointer;background:none;border:none;font-family:inherit;text-decoration:underline;margin-left:auto;flex-shrink:0}
/* Assumptions */
.assumptions-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.assumption-card{padding:18px}
.assumption-card h3{font-size:14px;font-weight:700;margin:0 0 10px}
.assumption-card p{font-size:12.5px;color:var(--muted);line-height:1.6;margin:0 0 8px}
.assumption-card p:last-child{margin-bottom:0}
.assumption-card ul,.assumption-card li{font-size:12.5px;color:var(--muted);line-height:1.6}
.assumption-card code{background:var(--surface2);border:1px solid var(--line);border-radius:4px;padding:1px 5px;font-size:11.5px;font-family:monospace;color:var(--ink)}
/* ── Phase 3: Calendar date badge ───────────────────────────────────── */
.week-date-badge{font-size:10px;font-weight:600;color:var(--muted2);background:var(--surface2);border:1px solid var(--line);border-radius:5px;padding:1px 6px;margin-left:5px;vertical-align:middle}
.task-date{font-size:10px;color:var(--muted2);margin-left:5px;white-space:nowrap}
/* ── Phase 3: Scenario preview ──────────────────────────────────────── */
.scenario-banner{display:flex;align-items:center;gap:10px;padding:10px 16px;border-radius:10px;margin-bottom:14px;font-size:13px;background:linear-gradient(135deg,#1e40af,#6d28d9);color:#fff}
.scenario-banner-lbl{font-weight:700;flex:1}
.scenario-banner-type{background:rgba(255,255,255,.18);border-radius:6px;padding:2px 8px;font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.scenario-cancel-btn{font-size:12px;font-weight:600;padding:5px 11px;border-radius:7px;border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;cursor:pointer;font-family:inherit}
.scenario-cancel-btn:hover{background:rgba(255,255,255,.12)}
.scenario-commit-btn{font-size:12px;font-weight:800;padding:5px 13px;border-radius:7px;border:none;background:#fff;color:#1e40af;cursor:pointer;font-family:inherit}
.scenario-commit-btn:hover{background:#eff6ff}
.scenario-type-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;max-width:680px;margin-bottom:18px}
.scenario-type-card{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:16px 18px;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.scenario-type-card:hover{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.scenario-type-card.s-active{border-color:var(--blue);background:#eff6ff}
.stc-icon{font-size:20px;margin-bottom:8px}
.stc-title{font-size:13px;font-weight:700;color:var(--ink)}
.stc-desc{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.4}
.scenario-form{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:16px 18px;max-width:500px}
.sc-field{margin-bottom:12px}
.sc-field label{display:block;font-size:11px;font-weight:700;color:var(--muted2);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.sc-field input,.sc-field select{width:100%;padding:8px 10px;border:1px solid var(--line2);border-radius:7px;font-family:inherit;font-size:13px;background:var(--surface);color:var(--ink);box-sizing:border-box}
.sc-field input:focus,.sc-field select:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.sc-cb-row{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink);margin-bottom:12px}
.sc-preview-box{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:11px 14px;margin-top:12px;font-size:12px}
.sc-preview-title{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted2);margin-bottom:8px}
.sc-diff-row{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid var(--line)}
.sc-diff-row:last-child{border-bottom:none}
.sc-diff-lbl{color:var(--muted)}
.sc-diff-val.pos{color:var(--green);font-weight:700}
.sc-diff-val.neg{color:var(--red);font-weight:700}
.sc-diff-val.neutral{color:var(--ink);font-weight:600}
.sc-apply-btn{margin-top:14px;padding:8px 18px;border-radius:8px;border:none;background:var(--blue);color:#fff;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer}
.sc-apply-btn:hover{opacity:.88}
.sc-apply-btn:disabled{opacity:.5;cursor:not-allowed}
/* Scenario commit modal */
.sc-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:500;display:flex;align-items:center;justify-content:center}
.sc-modal{background:var(--surface);border-radius:14px;padding:22px 24px;width:360px;box-shadow:0 20px 60px rgba(0,0,0,.22)}
.sc-modal-title{font-size:16px;font-weight:800;color:var(--ink);margin-bottom:6px}
.sc-modal-body{font-size:13px;color:var(--muted);line-height:1.55;margin-bottom:16px}
.sc-modal-note{font-size:11.5px;color:var(--muted2);background:var(--surface2);border-radius:6px;padding:7px 10px;margin-bottom:14px}
.sc-modal-btns{display:flex;gap:8px;justify-content:flex-end}
.sc-modal-cancel{font-size:13px;font-weight:600;padding:7px 13px;border-radius:8px;border:1px solid var(--line2);background:var(--surface2);color:var(--ink);cursor:pointer;font-family:inherit}
.sc-modal-confirm{font-size:13px;font-weight:700;padding:7px 16px;border-radius:8px;border:none;background:var(--blue);color:#fff;cursor:pointer;font-family:inherit}
/* ── Phase 3: AI Q&A ─────────────────────────────────────────────────── */
.ask-page{max-width:680px}
.ask-setup-card{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:16px}
.ask-setup-card h3{margin:0 0 5px;font-size:14px;font-weight:700;color:var(--ink)}
.ask-setup-card p{margin:0 0 10px;font-size:12px;color:var(--muted);line-height:1.5}
.ask-key-row{display:flex;gap:7px}
.ask-key-input{flex:1;padding:7px 10px;border:1px solid var(--line2);border-radius:7px;font-family:inherit;font-size:13px;background:var(--surface);color:var(--ink)}
.ask-key-save{padding:7px 13px;border-radius:7px;border:none;background:var(--blue);color:#fff;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer}
.ask-chat-area{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:12px;min-height:160px;max-height:380px;overflow-y:auto;margin-bottom:10px;display:flex;flex-direction:column;gap:9px}
.ask-msg{padding:9px 12px;border-radius:8px;font-size:13px;line-height:1.55;max-width:90%;word-break:break-word}
.ask-msg.user{background:var(--blue);color:#fff;align-self:flex-end;border-radius:8px 8px 2px 8px}
.ask-msg.assistant{background:var(--surface);border:1px solid var(--line);color:var(--ink);align-self:flex-start;border-radius:8px 8px 8px 2px}
.ask-msg.thinking{color:var(--muted2);font-style:italic;align-self:flex-start;font-size:12px}
.ask-empty{color:var(--muted2);font-size:12px;text-align:center;padding:24px 0;font-style:italic}
.ask-input-row{display:flex;gap:7px}
.ask-input{flex:1;padding:8px 11px;border:1px solid var(--line2);border-radius:8px;font-family:inherit;font-size:13px;background:var(--surface);color:var(--ink);resize:none}
.ask-input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.ask-send-btn{padding:8px 15px;border-radius:8px;border:none;background:var(--blue);color:#fff;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;align-self:flex-end}
.ask-send-btn:disabled{opacity:.5;cursor:not-allowed}
.ask-footer-note{font-size:11px;color:var(--muted2);margin-top:6px;line-height:1.4}
.ask-key-status{font-size:11px;color:var(--green);font-weight:600;margin-top:4px}
/* ── Wishlist ───────────────────────────────────────────────────────── */
.wl-header-bar{padding:0 2px 18px;border-bottom:1px solid var(--line);margin-bottom:18px}
.wl-page-title{font-size:17px;font-weight:800;color:var(--ink);margin-bottom:4px}
.wl-page-sub{font-size:12px;color:var(--muted);line-height:1.5;max-width:580px}
.wl-board{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:start}
.wl-col{background:var(--surface2);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.wl-col-header{display:flex;align-items:center;gap:7px;padding:11px 14px;border-bottom:1px solid var(--line);background:var(--surface)}
.wl-col-title{font-size:11px;font-weight:800;color:var(--ink);text-transform:uppercase;letter-spacing:.07em;flex:1}
.wl-col-count{font-size:11px;font-weight:700;color:var(--muted2);background:var(--surface2);border:1px solid var(--line);border-radius:99px;padding:1px 8px}
.wl-add-btn{font-size:11px;font-weight:600;padding:3px 9px;border-radius:7px;border:none;background:var(--blue);color:#fff;cursor:pointer;font-family:inherit}
.wl-add-btn:hover{opacity:.88}
.wl-col-body{padding:10px;display:flex;flex-direction:column;gap:7px;max-height:72vh;overflow-y:auto}
.wl-card{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:11px 13px}
.wl-card-title{font-size:13px;font-weight:600;color:var(--ink);margin-bottom:4px;line-height:1.35}
.wl-card-notes{font-size:11.5px;color:var(--muted);line-height:1.5;margin-bottom:8px}
.wl-card-footer{display:flex;align-items:center;gap:6px}
.wl-phase-tag{font-size:10px;font-weight:700;letter-spacing:.04em;padding:2px 7px;border-radius:99px;border:1px solid transparent;white-space:nowrap}
.wl-empty{color:var(--muted);font-size:12px;text-align:center;padding:28px 14px;font-style:italic;line-height:1.5}
.wl-card-actions{display:flex;gap:5px;margin-top:7px;flex-wrap:wrap}
.wl-move-btn{padding:3px 8px;border-radius:6px;border:1px solid var(--line2);background:var(--surface2);color:var(--muted2);font-size:10px;font-weight:700;cursor:pointer;font-family:inherit}
.wl-move-btn:hover{background:var(--blue);color:#fff;border-color:var(--blue)}
.wl-del-btn{padding:3px 8px;border-radius:6px;border:1px solid var(--redSoft);background:var(--redSoft);color:var(--red);font-size:10px;font-weight:700;cursor:pointer;font-family:inherit}
.wl-del-btn:hover{background:var(--red);color:#fff;border-color:var(--red)}
.wl-add-form{background:var(--surface);border:2px solid var(--blue);border-radius:9px;padding:11px 13px;margin-top:7px}
.wl-add-form-title{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--blue);margin-bottom:8px}
.wl-add-form input,.wl-add-form select,.wl-add-form textarea{width:100%;padding:6px 9px;border:1px solid var(--line2);border-radius:6px;font-family:inherit;font-size:12px;margin-bottom:6px;background:var(--surface);color:var(--ink);box-sizing:border-box}
.wl-add-form textarea{resize:vertical;min-height:44px}
.wl-form-btns{display:flex;gap:6px;margin-top:4px}
.wl-save-btn{padding:5px 12px;border-radius:7px;border:none;background:var(--blue);color:#fff;font-size:11px;font-weight:800;cursor:pointer;font-family:inherit}
.wl-cancel-btn{padding:5px 10px;border-radius:7px;border:1px solid var(--line2);background:transparent;color:var(--muted2);font-size:11px;cursor:pointer;font-family:inherit}
.wl-loading{color:var(--muted2);font-size:12px;text-align:center;padding:16px;font-style:italic}
/* Drawer (preserved from original) */
.drawer-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:399;display:none}
.drawer{position:fixed;top:0;right:0;height:100vh;width:420px;background:var(--surface);box-shadow:-4px 0 24px rgba(0,0,0,.18);z-index:400;overflow:hidden;transform:translateX(100%);transition:transform .22s ease;display:flex;flex-direction:column}
.drawer.open{transform:translateX(0)}
.drawer-hdr{display:flex;align-items:flex-start;justify-content:space-between;padding:20px 20px 0;flex-shrink:0}
.drawer-title-wrap{flex:1}.drawer-title{font-size:16px;font-weight:700;color:var(--ink)}.drawer-sub{font-size:12px;color:var(--muted);margin-top:3px;font-style:italic}
.drawer-close{width:30px;height:30px;border:1px solid var(--line2);border-radius:6px;background:var(--surface2);color:var(--muted);cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-left:8px;line-height:1}
.drawer-body{padding:0 20px 4px;flex:1;overflow-y:auto}
.drawer-sect{font-size:10px;font-weight:700;color:var(--muted2);text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px;margin-top:16px;border-bottom:1px solid var(--line);padding-bottom:4px}
.drawer-sect:first-of-type{margin-top:12px}
.drawer-error{font-size:12px;color:var(--red);background:var(--redSoft);border:1px solid #fca5a5;border-radius:6px;padding:8px 10px;margin-top:12px;display:none}
.ev-edit-row{display:grid;grid-template-columns:1fr 70px 80px 90px 36px 30px;gap:6px;align-items:center;margin-bottom:8px}
.ev-date-sel{font-size:11px;padding:5px 4px;border:1px solid var(--line2);border-radius:6px;background:var(--surface2);color:var(--muted);font-family:inherit;width:100%}
.ev-date-inline{font-size:11px;color:var(--muted2);font-weight:400;margin-left:2px}
.ev-tax-wrap{display:flex;flex-direction:column;align-items:center;gap:2px}
.ev-tax-lbl{font-size:9px;color:var(--muted2);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.ev-tax-cb{width:15px;height:15px;accent-color:#075985;cursor:pointer}
.ev-edit-lbl{font-size:12px;padding:6px 8px;border:1px solid var(--line2);border-radius:6px;background:var(--surface2);color:var(--ink);font-family:inherit;width:100%}
.ev-edit-type{font-size:12px;padding:6px 4px;border:1px solid var(--line2);border-radius:6px;background:var(--surface2);color:var(--ink);font-family:inherit}
.ev-edit-amt{font-size:12px;padding:6px 8px;border:1px solid var(--line2);border-radius:6px;background:var(--surface2);color:var(--ink);font-family:inherit;width:100%;text-align:right}
.ev-del-btn{width:28px;height:28px;border:1px solid #fca5a5;border-radius:6px;background:var(--redSoft);color:var(--red);cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ev-del-btn:hover{background:var(--red);color:white}
.modal-add-ev{font-size:12px;padding:7px 12px;border:1px dashed var(--line2);border-radius:6px;background:var(--surface2);color:var(--muted);cursor:pointer;font-family:inherit;margin-bottom:4px;width:100%;text-align:left}
.modal-add-ev:hover{border-color:var(--blue);color:var(--blue)}
.comm-hint{font-size:11px;color:#075985;background:#f0f9ff;border:1px solid #bae6fd;border-radius:6px;padding:8px 10px;margin-bottom:10px;line-height:1.55}
.modal-comm-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:4px}
.modal-field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.modal-label{font-size:11px;color:var(--muted);font-weight:600}
.modal-input{font-size:13px;padding:7px 9px;border:1px solid var(--line2);border-radius:6px;background:var(--surface2);color:var(--ink);font-family:inherit;width:100%}
.modal-input:focus{outline:2px solid var(--blue);border-color:var(--blue)}
.drawer-footer{padding:14px 20px;border-top:1px solid var(--line);background:var(--surface);flex-shrink:0;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.modal-save{padding:9px 18px;border:none;border-radius:8px;background:var(--blue);color:white;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
.modal-save:hover{background:#1d4ed8}
.modal-cancel{padding:9px 14px;border:1px solid var(--line2);border-radius:8px;background:var(--surface2);color:var(--muted);font-size:13px;cursor:pointer;font-family:inherit}
.modal-delete{padding:9px 14px;border:1px solid #fca5a5;border-radius:8px;background:var(--redSoft);color:var(--red);font-size:13px;cursor:pointer;font-family:inherit;margin-left:auto}

/* ── Phase 2: Focus states ─────────────────────────────────────────── */
*:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:4px}

.xfr-row.deferred .xlbl{color:var(--amber);font-weight:700}
.deferred-why{font-size:10px;color:var(--amber);margin-top:2px;font-style:italic}

.floor-health{margin-top:11px;padding:10px 14px;background:var(--surface2);border:1px solid var(--line);border-radius:9px;font-size:11px;display:flex;flex-direction:column;gap:8px}

.floor-divider{width:1px;background:var(--line);height:32px;margin:0 4px}

.floor-val.good{color:var(--green)}.floor-val.warn{color:var(--amber)}.floor-val.risk{color:var(--red)}
.floor-check-row{display:flex;align-items:center;gap:4px;padding-top:4px;border-top:1px solid var(--line)}
.floor-check-item{display:flex;flex-direction:column;gap:2px;min-width:100px;padding:0 10px}
.floor-check-item:first-child{padding-left:0}
.floor-check-item.grow{flex:1}

.var-label{font-size:9px;display:block;font-weight:600;margin-top:1px}
.var-label.fav{color:var(--green)}.var-label.unfav{color:var(--red)}.var-label.ok{color:var(--muted2)}

.confirm-no{padding:7px 14px;background:var(--surface);color:var(--muted);border:1px solid var(--line2);border-radius:6px;font-size:12px;cursor:pointer;font-family:inherit}

    }

    if(num===12){mvS(1500,'chk');tr.push({l:'Alaska trip $1,500 Truist Savings → Truist Checking',r:'done',a:1500,rsn:'Fund cruise week 1 costs from Alaska savings'});ac.push('Transfer $1,500 from Truist Savings to Truist Checking (Alaska cruise week 1)');}

    if(ct>0){const m=mv(ct,'tax');if(m>0){tr.push({l:'Commission 40% $'+fc(ct)+' Checking → Vio Bank - Tax Reserve',r:'done',rsn:'Post $'+fc(chk)+' ≥ '+fn});ac.push('Transfer $'+fc(ct)+' from Truist Checking to Vio Bank - Tax Reserve (commission 40%)');}else{taxTodo=r(taxTodo+ct);tr.push({l:'Commission 40% $'+fc(ct)+' deferred → tax pending',r:'defer',rsn:'No surplus above '+fn+' — picks up next eligible week'});}}
    if(ca>0&&alaska>0&&num>=AK_START){const m=mv(Math.min(ca,alaska),'sav',true);if(m>0){alaska=r(alaska-m);tr.push({l:'Commission 60% $'+fc(m)+' Checking → Truist Savings (Alaska)',r:'done',rsn:'Post $'+fc(chk)+' ≥ '+fn});ac.push('Transfer $'+fc(m)+' from Truist Checking to Truist Savings (Alaska)');}else tr.push({l:'Commission 60% $'+fc(ca)+' deferred',r:'defer',rsn:'No surplus above '+fn});}
    // EF_SAV_XFR eliminated — starting balances reflect real-world moves
    // EF_CHK_XFR eliminated — starting balances reflect real-world moves
    if(taxTodo>0&&ct===0){const m=mv(taxTodo,'tax');if(m>0){taxTodo=r(taxTodo-m);const rem=taxTodo>0?' — $'+fc(taxTodo)+' carries forward':'';tr.push({l:'Tax $'+fc(m)+' Checking → Vio Bank - Tax Reserve'+rem,r:'done',rsn:'Post $'+fc(chk)+' ≥ '+fn});ac.push('Transfer $'+fc(m)+' from Truist Checking to Vio Bank - Tax Reserve');}else tr.push({l:'Tax $'+fc(taxTodo)+' Checking → Vio Bank - Tax Reserve',r:'defer',rsn:'Post-obligations $'+fc(chk)+' — no surplus above '+fn});}
    if(alaska>0&&num>=AK_START&&taxTodo===0&&ca===0){const m=mv(alaska,'sav',true);if(m>0){alaska=r(alaska-m);const rem=alaska>0?' — $'+fc(alaska)+' remaining':' — Alaska funded!';tr.push({l:'Alaska $'+fc(m)+' Checking → Truist Savings'+rem,r:'done',rsn:'Post $'+fc(chk)+' ≥ '+fn});ac.push('Transfer $'+fc(m)+' from Truist Checking to Truist Savings (Alaska fund)');}else{const pot=r(sm(chk,alaska,effFl));if(pot>0&&pot<MIN_XFR)tr.push({l:'Alaska $'+fc(pot)+' suppressed (<$100) — rolls forward',r:'info',rsn:'Too small; carries to next eligible week'});else tr.push({l:'Alaska surplus deferred',r:'defer',rsn:'Post-obligations $'+fc(chk)+' — no surplus above '+fn});}}
    if(retSav>0&&alaska===0){const m=mvS(retSav,'amx');retSav=0;tr.push({l:'Retirement $'+fc(m)+' Truist Savings → AMEX Savings',r:'done',rsn:'Savings move — zero checking impact'});ac.push('Transfer $'+fc(m)+' from Truist Savings to AMEX Savings (retirement)');}
    if(retChk>0&&alaska===0){const m=mv(retChk,'amx',true);if(m>0){retChk=r(retChk-m);const rem=retChk>0?' — $'+fc(retChk)+' remaining':' — retirement funded!';tr.push({l:'Retirement $'+fc(m)+' Checking → AMEX Savings'+rem,r:'done',rsn:'Post $'+fc(chk)+' ≥ '+fn});ac.push('Transfer $'+fc(m)+' from Truist Checking to AMEX Savings (retirement rebuild)');}else{const pot=r(sm(chk,retChk,effFl));if(pot>0&&pot<MIN_XFR)tr.push({l:'Retirement $'+fc(pot)+' suppressed (<$100) — rolls forward',r:'info',rsn:'Too small; carries to next eligible week'});else tr.push({l:'Retirement surplus deferred',r:'defer',rsn:'Post-obligations $'+fc(chk)+' — no surplus above '+fn});}}
    // LC_LEVELUP eliminated — LC is static EF, no activity this model year
    if(alaska===0&&retChk<=0){
      var surplusAvail=r(Math.max(0,chk-effFl));
      if(!surplusStart&&surplusAvail>0)surplusStart=num;
      surplusSwept=r(surplusSwept+surplusAvail); // cumulative FGB virtual total — money stays in checking

    if(!tr.length){tr.push({l:'No transfers this week',r:'info',rsn:'No surplus above floor after obligations'});ac.push('No transfers this week — monitor balances');}
    const mChk=r(chk),mSav=r(sav),mAmx=r(amx),mTax=r(tax),mLc=r(lc);
    let reconciled=false,variance=null,actualBals=null;
    if(reconData[num]){
      const rec=reconData[num];

      chk=rec.chk;sav=rec.sav;amx=rec.amx;tax=rec.tax;lc=rec.lc;
    }
    const realActs=ac.filter(function(a){return!a.includes('No transfers');});
    const totalTasks=realActs.length;
    let doneTasks=0;
    for(var ti=0;ti<totalTasks;ti++){if(taskData[num+'_'+ti]&&taskData[num+'_'+ti].completed)doneTasks++;}
    // ── Recurring Jabian reimbursement review (first Adam-paycheck week of each month)
    if([5,9,14,18,22,27,31].indexOf(num)>=0){
      recActs.push('Review Jabian reimbursements — compare expected vs. received. If a large or unusual amount is pending or recently arrived, add it as a one-time inflow via Edit Week. No action needed if reimbursements are on schedule.');}
        weeks.push({num,dates,trough:false,managed:false,calNote,evs,tr,ac,recActs,realActs,totalTasks,doneTasks,
      chk:r(chk),sav:r(sav),amx:r(amx),tax:r(tax),lc:r(lc),
      mChk,mSav,mAmx,mTax,mLc,
      akSaved:r(akGoal-alaska),akRem:r(alaska),retRem:r(retChk),ol:r(chk+sav),
      surplusSwept:r(surplusSwept),surplusStart,
      startChk,startSav,startAmx,startTax,startLc,
      reconciled,variance,actualBals});
  }
  return weeks;
}

function f(n){return '$'+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
function fc(n){return n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
function getCurrentWeek(){const s=new Date(2026,5,7);const t=new Date();t.setHours(0,0,0,0);s.setHours(0,0,0,0);const d=Math.floor((t-s)/864e5);if(d<0)return 1;return Math.min(Math.floor(d/7)+1,31);}
const currentW=getCurrentWeek();
// Returns the calendar week-of-year for a given model week number (1–31)
function getCalWeek(modelWeekNum){
  var d=new Date(2026,5,7+(modelWeekNum-1)*7);
  var yearStart=new Date(d.getFullYear(),0,1);
  var dayOfYear=Math.ceil((d-yearStart)/864e5)+1;
  return Math.ceil(dayOfYear/7);
}
function formatWeekRange(ymd){
  const d=new Date(ymd+'T12:00:00');const end=new Date(d);end.setDate(end.getDate()+6);
  const mo=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const sm=mo[d.getMonth()],em=mo[end.getMonth()];const sy=d.getFullYear(),ey=end.getFullYear();
  if(sy!==ey)return sm+' '+d.getDate()+'–'+em+' '+end.getDate()+' '+ey;
  if(sm===em)return sm+' '+d.getDate()+'-'+end.getDate();
  return sm+' '+d.getDate()+'-'+em+' '+end.getDate();
}

// ── buildDashboardViewModel ────────────────────────────────────────────────
function buildDashboardViewModel(weeks,goals){
  const current=weeks.find(function(w){return w.num===activeW;})||weeks[0];
  const finalWeek=weeks[weeks.length-1];
  const alaskaCompletion=weeks.find(function(w){return w.akRem<=0.01;})||null;
  const retirementCompletion=weeks.find(function(w){return w.retRem<=0.01;})||null;
  const surplusCompletion=weeks.find(function(w){return w.surplusSwept>0;})||null;
  const lowestChecking=weeks.reduce(function(min,w){return w.chk<min.chk?w:min;},weeks[0]);
  const allActions=weeks.flatMap(function(w){
    return w.realActs.map(function(label,index){
      const key=w.num+'_'+index;
      return{weekNum:w.num,taskIdx:index,label:label,completed:!!(taskData[key]&&taskData[key].completed)};
    });
  });
  return{
    goals:goals,weeks:weeks,current:current,finalWeek:finalWeek,
    currentWeekNum:current.num,alaskaCompletion:alaskaCompletion,
    retirementCompletion:retirementCompletion,surplusCompletion:surplusCompletion,lowestChecking:lowestChecking,
    allActions:allActions,openActions:allActions.filter(function(a){return!a.completed;}),
    troughWeeks:weeks.filter(function(w){return w.trough;}),
    managedWeeks:weeks.filter(function(w){return w.managed;}),
    reconciledWeeks:weeks.filter(function(w){return w.reconciled;}),
    editedWeeks:weeks.filter(function(w){return!!overrideData[w.num];}),
    futureWeeks:weeks.filter(function(w){return w.num>currentW;}),
    pastWeeks:weeks.filter(function(w){return w.num<currentW;})
  };
}

    return '<div class="'+cls+'" onclick="activeW='+w.num+';renderApp()'+
      '" title="Wk '+getCalWeek(w.num)+' · '+w.dates+'"><span class="n">'+getCalWeek(w.num)+'</span><span class="d">'+mo+dy+'</span></div>';
  }).join('');
  var reconCount=vm.reconciledWeeks.length;
  var nextRisk=vm.weeks.find(function(w){return w.num>=currentW&&!!w.calNote;});

    '<div class="t-insight"><div class="label">Current week</div><div class="val">Wk '+getCalWeek(currentW)+'</div><div class="meta">'+
      (vm.weeks.find(function(w){return w.num===currentW;})||vm.weeks[0]).dates+'</div></div>'+
    '<div class="t-insight"><div class="label">Next risk</div><div class="val">'+
      (nextRisk?'Wk '+getCalWeek(nextRisk.num):'Clear')+'</div><div class="meta">'+nextRiskLabel+'</div></div>'+
    '<div class="t-insight"><div class="label">Open actions</div><div class="val">'+vm.openActions.length+'</div><div class="meta">'+reconCount+' of '+vm.pastWeeks.length+' past wks reconciled</div></div>'+
  '</div>';
  var legendHtml='<div class="timeline-legend">'+
    '<div class="legend-item"><div class="legend-dot" style="background:var(--blueSoft);border:2px solid var(--blue)"></div>Current</div>'+
    '<div class="legend-item"><div class="legend-dot" style="background:var(--amberSoft);border:1px solid #fbbf24"></div>Low-liquidity</div>'+
    '<div class="legend-item"><div class="legend-dot" style="background:var(--greenSoft);border:1px solid var(--green)"></div>Reconciled</div>'+
    '<div class="legend-item"><div class="legend-dot" style="background:white;border:2px dashed var(--line2)"></div>Custom</div>'+
  '</div>';
  return '<div class="timelineWrap"><div class="timeline">'+chips+'</div></div>'+insightHtml+legendHtml;
}

// ── renderGoalRail ─────────────────────────────────────────────────────────

    '</div>'+
    '<div class="progress-goal">'+
      '<div class="goal-top"><span class="name">Retirement rebuild</span><span class="value">'+f(_grw.amx)+' / '+f(vm.goals.rt)+'</span></div>'+
      '<div class="prog-bar"><div class="prog-fill" style="background:var(--violet);width:'+rtPct+'%"></div></div>'+

    '</div>'+

    '</div>'+
  '</div>';
}

          '<div class="risk-title">Checking cushion</div>'+

          '<div class="risk-meta" style="margin-top:1px;opacity:.85">'+(nextRisk?'Next thin: Wk '+getCalWeek(nextRisk.num)+' · '+f(nextRisk.chk)+' projected':'No thin weeks remaining ✓')+'</div>'+
        '</div>'+
      '</div>'+
      (nextRisk?'<div class="risk-item">'+
        '<div class="risk-icon '+(nextRisk.chk<1500?'risk':'warn')+'">⚠️</div>'+
        '<div><div class="risk-title">Thin week: Wk '+getCalWeek(nextRisk.num)+' · '+nextRisk.dates+'</div>'+
        '<div class="risk-meta">'+(nextRisk.num-currentW)+' week'+(nextRisk.num-currentW!==1?'s':'')+' away · '+f(nextRisk.chk)+' projected · '+(nextRisk.calNote||'low-liquidity week')+'</div></div>'+

        '<div><div class="risk-title">'+(vm.alaskaCompletion&&vm.retirementCompletion?'Both goals funded':'Goals in progress')+'</div>'+
        '<div class="risk-meta">'+(vm.alaskaCompletion&&vm.retirementCompletion?'Alaska ✓ · Retirement ✓ · Surplus accumulating in CHK':vm.alaskaCompletion?'Alaska ✓ · Retirement by Wk '+getCalWeek(vm.retirementCompletion?vm.retirementCompletion.num:10):'Alaska by Wk '+(vm.alaskaCompletion?getCalWeek(vm.alaskaCompletion.num):'TBD'))+' · '+(lastReconW?'Reconciled thru Wk '+getCalWeek(lastReconNum):'Not reconciled')+'</div></div>'+
      '</div>'+
    '</div>'+
  '</div>';
  html+='<div class="health-grid">'+'<div class="health-card"><div class="health-label">Checking (Wk '+getCalWeek(currentW)+')</div><div class="health-value '+chkCls+'">'+f(w.chk)+'</div><div class="health-hint '+cCls2+'">Cushion: '+(cushion>=0?'+':'')+f(Math.abs(cushion))+' vs $6,500 floor</div></div>'+'<div class="health-card"><div class="health-label">Truist Savings</div><div class="health-value good">'+f(w.sav)+'</div><div class="health-hint good">Alaska fund + float</div></div>'+'<div class="health-card"><div class="health-label">Tax Reserve (Vio)</div><div class="health-value '+(w.tax>0?'good':'warn')+'">'+f(w.tax)+'</div><div class="health-hint">Income tax set aside</div></div>'+'<div class="health-card"><div class="health-label">AMEX Savings</div><div class="health-value '+(w.amx>=7690.98?'good':w.amx>99.75?'warn':'risk')+'">'+f(w.amx)+'</div><div class="health-hint">Retirement rebuild</div></div>'+'</div>';
  html+='<div class="timelineForecastPanel">'+
    '<div class="panel timelineCard"><div class="timeline-header"><h3>31-Week Timeline</h3><span>Click to highlight · scroll to see all · use Weekly Model to drill in</span></div>'+

// ── renderWeekDetail ───────────────────────────────────────────────────────

        (nextW?'<button class="wnav-arrow" onclick="activeW='+(w.num+1)+';renderApp()" title="Wk '+getCalWeek(w.num+1)+' · '+nextW.dates+'">→</button>':'<span class="wnav-arrow-ph"></span>')+
      '</div>'+
      '<div class="wk-action-row">'+
        '<button class="btn" onclick="openEdit('+w.num+')">Edit week</button>'+

          (w.reconciled?'Update actuals':'Reconcile')+'</button>':'')+
      '</div>'+
    '</div>'+
    '<div class="wk-badge-row">'+
      (hasOverride?'<span class="badge badge-edited">Edited</span>':'')+
      (w.reconciled?'<span class="badge badge-recon">Reconciled \xb7 '+w.actualBals.date+'</span>':'')+
      (isPastWeek?'<span class="badge badge-past">Past</span>':'')+
      (isNowWeek?'<span class="badge badge-now">● This week</span>':'')+
      (w.calNote?'<span class="badge badge-trough">⚠️ Low-liquidity week</span>':w.chk<OP_FL?'<span class="badge badge-trough">Watch</span>':'<span class="badge badge-op">Normal week</span>')+
    '</div>'+
  '</div>';
  // Cash flow + transfers
  html+='<div class="two-col">'+
    '<div class="panel card-pad">'+
      (w.evs&&w.evs.length?
        '<div class="sect">Cash flow this week</div>'+
        w.evs.map(function(e){
          var cls=e.t==='in'?'ev-in':'ev-out';var sign=e.t==='in'?'+':'−';
          return'<div class="ev-row"><span class="ev-lbl">'+e.l+(e.d?'<span class="ev-date-inline"> · '+e.d+'</span>':'')+'</span><span class="'+cls+'">'+sign+f(Math.abs(e.a))+'</span></div>';
        }).join(''):'<div class="sect">Cash flow this week</div><div style="color:var(--muted);font-size:13px;padding:8px 0">No scheduled events this week.</div>')+
    '</div>'+
    '<div class="panel card-pad">'+
      (function(){
        var done=w.tr.filter(function(x){return x.r==='done'||x.r==='info';});
        var deferred=w.tr.filter(function(x){return x.r==='defer';});
        var html='';
        if(done.length){
          html+='<div class="xfr-section-hdr">Transfers this week<span class="week-date-badge">'+getWeekDate(activeW)+'</span></div>';
          html+=done.map(function(x){
            var ic=x.r==='info'?'ℹ️':'✅';
            return'<div class="xfr-row"><span class="xi">'+ic+'</span><div class="xtext"><div class="xlbl">'+x.l+'</div><div class="xrsn">'+x.rsn+'</div></div></div>';
          }).join('');
        }
        if(deferred.length){
          html+='<div class="xfr-section-hdr" style="color:var(--amber)">⏸ Deferred — floor protected</div>';
          html+=deferred.map(function(x){
            var floorAmt=OP_FL;
            var why='Checking ('+f(w.chk)+') held above '+f(floorAmt)+' floor — transfer skipped this cycle';
            return'<div class="xfr-row deferred"><span class="xi">⏸</span><div class="xtext"><div class="xlbl">'+x.l+'</div><div class="xrsn">'+x.rsn+'</div><div class="deferred-why">'+why+'</div></div></div>';
          }).join('');
        }
        if(!done.length&&!deferred.length){html='<div style="color:var(--muted);font-size:13px;padding:8px 0">No transfers this week.</div>';}
        return html;
      }())+
    '</div>'+
  '</div>';
  // Balance table
  var accounts=[
    {name:'Truist Checking',start:w.startChk,model:w.mChk,end:w.chk,actual:w.reconciled?w.actualBals.chk:null},
    {name:'Truist Savings',start:w.startSav,model:w.mSav,end:w.sav,actual:w.reconciled?w.actualBals.sav:null},
    {name:'AMEX Savings',start:w.startAmx,model:w.mAmx,end:w.amx,actual:w.reconciled?w.actualBals.amx:null},
    {name:'Vio Bank - Tax Reserve',start:w.startTax,model:w.mTax,end:w.tax,actual:w.reconciled?w.actualBals.tax:null},
    {name:'Lending Club (EF)',start:w.startLc,model:w.mLc,end:w.lc,actual:w.reconciled?w.actualBals.lc:null},

    '<div class="sect">Account balances</div>'+

      '<th>Actual</th><th>Variance</th>'+
    '</tr></thead><tbody>'+
    accounts.map(function(acc){
      var actualCell,varCell;
      if(w.reconciled&&acc.actual!==null){
        var v=Math.round((acc.actual-acc.model)*100)/100;
        var vCls=v<-VAR_THRESHOLD?'var-neg':v>VAR_THRESHOLD?'var-pos':'var-ok';
        var vStr=(v>=0?'+':'−')+f(Math.abs(v));
        var vLbl=v<-VAR_THRESHOLD?'Unfavorable':v>VAR_THRESHOLD?'Favorable':'On plan';
        var vLblCls=v<-VAR_THRESHOLD?'unfav':v>VAR_THRESHOLD?'fav':'ok';
        actualCell='<td>'+f(acc.actual)+'</td>';
        varCell='<td class="'+vCls+'">'+vStr+'<span class="var-label '+vLblCls+'">'+vLbl+'</span></td>';
      }else{
        actualCell='<td style="color:var(--muted2)">—</td>';
        varCell='<td style="color:var(--muted2)">—</td>';
      }
      return'<tr><td>'+acc.name+'</td><td>'+f(acc.start)+'</td><td>'+f(acc.model)+'</td>'+actualCell+varCell+'</tr>';
    }).join('')+
    '</tbody></table>'+
    '<div class="liq-row"><span class="liq-label">Operational liquidity (Checking + Savings)</span><span class="liq-val">'+f(w.ol)+'</span></div>'+
    (function(){
      var fl=OP_FL;
      var flLabel='Operating floor';
      var cushion=Math.round((w.chk-fl)*100)/100;
      var cCls=cushion<0?'risk':cushion<500?'warn':'good';
      var cStr=(cushion>=0?'+':'')+f(cushion)+' vs floor';
      var statusStr=w.chk<OP_FL?'Watch — below operating floor':'Normal';
      var totalIn=w.evs.filter(function(e){return e.a>0;}).reduce(function(s,e){return s+e.a;},0);
      var totalOut=w.evs.filter(function(e){return e.a<0;}).reduce(function(s,e){return s+e.a;},0);
      var savToChk=w.tr.filter(function(t){return t.a>0&&t.l&&t.l.indexOf('Savings → Truist Checking')>=0;}).reduce(function(s,t){return s+t.a;},0);
      return'<div class="floor-health">'+
        '<div class="floor-row">'+
          '<div class="floor-item"><div class="floor-lbl">Beginning</div><div class="floor-val">'+f(w.startChk)+'</div></div>'+
          '<div class="floor-arrow">+</div>'+
          '<div class="floor-item"><div class="floor-lbl">Inflows</div><div class="floor-val" style="color:var(--green)">'+f(totalIn)+'</div></div>'+
          (savToChk>0?'<div class="floor-arrow">+</div><div class="floor-item"><div class="floor-lbl">Savings Drawdown</div><div class="floor-val" style="color:var(--blue)">'+f(savToChk)+'</div></div>':'')+
          '<div class="floor-arrow">−</div>'+
          '<div class="floor-item"><div class="floor-lbl">Outflows</div><div class="floor-val" style="color:var(--red)">'+f(Math.abs(totalOut))+'</div></div>'+
          '<div class="floor-arrow">=</div>'+
          '<div class="floor-item"><div class="floor-lbl">Ending (Checking)</div><div class="floor-val">'+f(w.chk)+'</div></div>'+
        '</div>'+
        '<div class="floor-check-row">'+
          '<div class="floor-check-item"><div class="floor-lbl">'+flLabel+'</div><div class="floor-val">'+f(fl)+'</div></div>'+
          '<div class="floor-divider"></div>'+
          '<div class="floor-check-item"><div class="floor-lbl">Cushion</div><div class="floor-val '+cCls+'">'+cStr+'</div></div>'+
          '<div class="floor-divider"></div>'+
          '<div class="floor-check-item grow"><div class="floor-lbl">Status</div><div class="floor-val '+cCls+'">'+statusStr+'</div></div>'+
        '</div>'+
      '</div>';
    }())+
    (w.reconciled&&w.variance?function(){
      var underItems=[],over=[];
      var names=['chk','sav','amx','tax','lc'];var labels=['Checking','Savings','AMEX','Vio Bank - Tax Reserve','Lending Club'];
      names.forEach(function(k,i){
        if(w.variance[k]<-VAR_THRESHOLD)underItems.push(labels[i]+' −'+f(Math.abs(w.variance[k])));
        else if(w.variance[k]>VAR_THRESHOLD)over.push(labels[i]+' +'+f(w.variance[k]));
      });
      if(!underItems.length&&!over.length)return'';
      return'<div class="variance-alert"><div class="variance-title">⚠️ Variance from plan (>$'+VAR_THRESHOLD.toLocaleString()+')</div><div class="variance-items">'+
        underItems.map(function(s){return'<span class="vitem over">'+s+' above plan</span>';}).join('')+
        over.map(function(s){return'<span class="vitem under">'+s+' below plan</span>';}).join('')+
      '</div></div>';
    }():'')+'</div>';
  // Tasks
  if(w.realActs.length){
    var progCls=w.doneTasks===w.totalTasks?'all-done':'partial';
    var progTxt=w.doneTasks+'/'+w.totalTasks+' done';
    html+='<div class="panel card-pad"><div class="acts">'+
      '<div class="act-hdr">Required actions this week <span class="act-progress '+progCls+'">'+progTxt+'</span></div>'+

      }).join('')+
    '</div></div>';
  }
  // Recommended actions (no checkbox, no progress, not counted in openActions)
  if(w.recActs&&w.recActs.length){
    html+='<div class="panel card-pad"><div class="acts">'+
      '<div class="act-hdr">Recommended review this week</div>'+
      w.recActs.map(function(a){
        return'<div class="rec-row"><span class="rec-icon">💡</span><span class="rec-text">'+a+'</span></div>';
      }).join('')+
    '</div></div>';
  }

  var note=noteData[w.num]||'';
  html+='<div class="panel card-pad">'+
    '<div class="notes-hdr">Week notes</div>'+
    '<textarea class="notes-area" id="na_'+w.num+'" placeholder="Add notes for this week..." onblur="saveNote('+w.num+',this)">'+note.replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</textarea>'+
    '<div class="notes-saved" id="ns_'+w.num+'"></div>'+
  '</div>';

  html+='<div class="panel card-pad">';

    html+='<div class="recon-done-row"><span class="recon-done-lbl">✅ Reconciled \xb7 '+w.actualBals.date+'</span><button class="recon-edit-btn" onclick="openRecon('+w.num+')">Edit actuals</button></div>';
  }else if((isPastWeek||isNowWeek)&&reconOpen!==w.num){
    html+='<button class="recon-open-btn" onclick="openRecon('+w.num+')">Reconcile this week ✏️ — enter actual balances</button>';

  var mobOpts=vm.weeks.map(function(wx){

    var lbl='Wk '+getCalWeek(wx.num)+' · '+wx.dates.split('-')[0].trim()+(isNow?' ● Now':isPast&&wx.reconciled?' ✓':isPast?' ○':'');

      '<div class="wl-leg-item"><span class="wl-leg-dot reconciled"></span>Reconciled</div>'+
      '</div>'+

    '</div>'+
    '<div class="week-detail" id="week-detail-content">'+renderWeekDetail(w,vm.weeks)+'</div>'+
  '</div>';
  document.getElementById('weekly-content').innerHTML=html;

  requestAnimationFrame(function(){

}

// ── renderHistory ──────────────────────────────────────────────────────────
function setHistoryFilter(f){historyFilter=f;var g=getGoals();renderHistory(runModel(g.ak,g.rt));}
function renderHistory(weeksArg){
  var weeks=weeksArg;
  if(!weeks){var g=getGoals();weeks=runModel(g.ak,g.rt);}
  var reconKeys=Object.keys(reconData).map(Number).filter(function(n){return reconData[n]&&reconData[n].chk!==undefined;});
  var maxRecon=reconKeys.length?Math.max.apply(null,reconKeys):0;
  // Filter logic
  var filters=[
    {id:'all',label:'All ('+weeks.length+')'},
    {id:'reconciled',label:'Reconciled ('+weeks.filter(function(w){return w.reconciled;}).length+')'},
    {id:'open',label:'Open Actions ('+weeks.filter(function(w){return w.realActs.length&&w.realActs.some(function(_,i){return!taskData[w.num+'_'+i]||!taskData[w.num+'_'+i].completed;});}).length+')'},
    {id:'variance',label:'Variance >$'+VAR_THRESHOLD+' ('+weeks.filter(function(w){return w.reconciled&&w.variance&&Object.values(w.variance).some(function(v){return Math.abs(v)>VAR_THRESHOLD;});}).length+')'},
    {id:'trough',label:'Trough ('+weeks.filter(function(w){return w.trough;}).length+')'},
    {id:'managed',label:'Managed ('+weeks.filter(function(w){return w.managed;}).length+')'},
    {id:'edited',label:'Edited ('+weeks.filter(function(w){return!!overrideData[w.num]&&!overrideData[w.num].is_custom;}).length+')'},
    {id:'custom',label:'Custom ('+weeks.filter(function(w){return overrideData[w.num]&&overrideData[w.num].is_custom;}).length+')'},
  ];
  var filteredWeeks=weeks;
  if(historyFilter==='reconciled')filteredWeeks=weeks.filter(function(w){return w.reconciled;});
  else if(historyFilter==='open')filteredWeeks=weeks.filter(function(w){return w.realActs.length&&w.realActs.some(function(_,i){return!taskData[w.num+'_'+i]||!taskData[w.num+'_'+i].completed;});});
  else if(historyFilter==='variance')filteredWeeks=weeks.filter(function(w){return w.reconciled&&w.variance&&Object.values(w.variance).some(function(v){return Math.abs(v)>VAR_THRESHOLD;});});
  else if(historyFilter==='trough')filteredWeeks=weeks.filter(function(w){return w.trough;});
  else if(historyFilter==='managed')filteredWeeks=weeks.filter(function(w){return w.managed;});
  else if(historyFilter==='edited')filteredWeeks=weeks.filter(function(w){return!!overrideData[w.num]&&!overrideData[w.num].is_custom;});
  else if(historyFilter==='custom')filteredWeeks=weeks.filter(function(w){return overrideData[w.num]&&overrideData[w.num].is_custom;});
  var html='<div class="history-filters">'+filters.map(function(fi){return'<button class="filter-btn'+(historyFilter===fi.id?' active':'')+'" onclick="setHistoryFilter(\''+fi.id+'\')">'+fi.label+'</button>';}).join('')+'</div>';
  html+='<div class="history-summary"><strong>Progress tracker</strong> — '+reconKeys.length+' of '+currentW+' past week'+(currentW!==1?'s':'')+' reconciled.'+(maxRecon?' Last reconciled: Week '+maxRecon+'.':'')+' Click any row to jump to that week.</div>';
  if(!filteredWeeks.length){html+='<div style="color:var(--muted);font-size:13px;padding:16px 0">No weeks match this filter.</div>';}
  filteredWeeks.forEach(function(wx){
    var isPast=wx.num<currentW;var isNow=wx.num===currentW;
    var hasOpenTasks=isPast&&wx.realActs.length&&wx.realActs.some(function(_,i){return!taskData[wx.num+'_'+i]||!taskData[wx.num+'_'+i].completed;});
    var cls='hcard';
    if(isNow&&wx.reconciled)cls+=' past-recon current-recon';
    else if(isNow)cls+=' current';
    else if(!isPast)cls+=' future';
    else if(wx.reconciled&&!hasOpenTasks)cls+=' past-recon';
    else if(hasOpenTasks)cls+=' past-open';
    var statusColor=isNow?'color:#92400e':!isPast?'color:var(--muted2)':wx.reconciled?'color:var(--green)':'color:var(--muted)';
    var statusTxt=isNow&&wx.reconciled?'✅ Current · Reconciled':isNow?'▶ Current':!isPast?'Future':wx.reconciled?'✅ Reconciled':'□ Not reconciled';
    html+='<div class="'+cls+'"><div class="hcard-hdr"><div><div class="hcard-title">Week '+wx.num+'</div><div class="hcard-dates">'+wx.dates+'</div></div><div class="hcard-status" style="'+statusColor+'">'+statusTxt+'</div></div>';
    html+='<div class="hcard-bals">';

// ── Calendar date helpers ─────────────────────────────────────────────────
function getWeekStartDate(n){return new Date(2026,5,7+(n-1)*7);}
function fmtDate(d){var M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];return M[d.getMonth()]+' '+d.getDate();}
function getWeekDate(n){return fmtDate(getWeekStartDate(n));}

// ── Scenario-aware model runner ───────────────────────────────────────────
function getActiveModel(){
  var g=getGoals();
  if(!scenarioState.active)return runModel(g.ak,g.rt);
  var ak=scenarioState.previewGoal?scenarioState.previewGoal.ak:g.ak;
  var rt=scenarioState.previewGoal?scenarioState.previewGoal.rt:g.rt;
  if(scenarioState.type==='goal')return runModel(ak,rt);
  var wn=scenarioState.weekNum;
  var saved=overrideData[wn];var hasSaved=(saved!==undefined);
  overrideData[wn]=scenarioState.previewOverride;
  var weeks=runModel(ak,rt);
  if(hasSaved)overrideData[wn]=saved;else delete overrideData[wn];
  return weeks;
}

// ── Scenario: build preview override for a week-based scenario ────────────
function buildScenarioPreviewOverride(weekNum,addEvents,addCt,addCa){
  var existing=overrideData[weekNum];
  var _wd=WD.find(function(w){return w[0]===weekNum;})||[];
  var baseEvs=existing&&existing.events_json&&existing.events_json.length?existing.events_json:_wd[4]||[];
  var mergedEvs=baseEvs.concat(addEvents);
  var baseCt=(existing&&existing.ct!=null)?existing.ct:_wd[5]||0;
  var baseCa=(existing&&existing.ca!=null)?existing.ca:_wd[6]||0;
  return Object.assign({},existing||{},{week_num:weekNum,events_json:mergedEvs,ct:baseCt+(addCt||0),ca:baseCa+(addCa||0)});
}

// ── Scenario: apply (set preview active) ─────────────────────────────────
function applyScenario(){
  var type=scenarioState.type;
  var wn=scenarioState.weekNum;
  var p=scenarioState.params;
  if(type==='commission'){
    var gross=parseFloat(p.gross)||0;
    var ct=Math.round(gross*0.40*100)/100;
    var ca=Math.round(gross*0.60*100)/100;
    var addEvs=p.taxable?[{l:'Commission income ('+f(gross)+')',t:'in',a:gross,tx:true}]:[{l:'Commission income ('+f(gross)+')',t:'in',a:gross}];
    scenarioState.previewOverride=buildScenarioPreviewOverride(wn,addEvs,ct,ca);
  }else if(type==='expense'){
    var amt=parseFloat(p.amount)||0;
    var addEvs=[{l:p.label||'One-time expense',t:'ob',a:-Math.abs(amt)}];
    scenarioState.previewOverride=buildScenarioPreviewOverride(wn,addEvs,0,0);
  }else if(type==='inflow'){
    var amt=parseFloat(p.amount)||0;
    var addEvs=[{l:p.label||'One-time inflow',t:'in',a:Math.abs(amt),tx:!!p.taxable}];
    var ct2=p.taxable?Math.round(amt*0.40*100)/100:0;
    var ca2=p.taxable?Math.round(amt*0.60*100)/100:0;
    scenarioState.previewOverride=buildScenarioPreviewOverride(wn,addEvs,ct2,ca2);
  }else if(type==='goal'){
    scenarioState.previewGoal={ak:parseFloat(p.ak)||goalAk,rt:parseFloat(p.rt)||goalRt};
  }
  scenarioState.active=true;
  setSection('scenarios');renderApp();
}

// ── Scenario: clear ────────────────────────────────────────────────────────
function clearScenario(){
  scenarioState={active:false,type:null,weekNum:currentW,params:{},previewOverride:null,previewGoal:null,commitModal:false};
  renderApp();
}

// ── Scenario: open commit modal ────────────────────────────────────────────
function openScenarioCommit(){scenarioState.commitModal=true;renderApp();}
function closeScenarioCommit(){scenarioState.commitModal=false;renderApp();}

// ── Scenario: commit (write to Supabase) ───────────────────────────────────
async function commitScenario(){
  try{
    if(scenarioState.type==='goal'&&scenarioState.previewGoal){
      goalAk=scenarioState.previewGoal.ak;
      goalRt=scenarioState.previewGoal.rt;
      await saveGoal('ak_goal',goalAk);
      await saveGoal('rt_goal',goalRt);
    }else if(scenarioState.previewOverride){
      var payload=scenarioState.previewOverride;
      payload.updated_at=new Date().toISOString();
      await fetch(SUPA_URL+'/rest/v1/model_week_overrides',{method:'POST',headers:Object.assign({},SUPA_H,{'Prefer':'resolution=merge-duplicates,return=minimal'}),body:JSON.stringify(payload)});
      overrideData[payload.week_num]=payload;
    }
    clearScenario();
  }catch(e){console.error('commitScenario:',e);alert('Error saving scenario: '+e.message);}
}

function _diffRow(label,before,after,invertGood){
  var delta=Math.round((after-before)*100)/100;
  if(Math.abs(delta)<0.01)return'<div class="sc-diff-row"><span class="sc-diff-lbl">'+label+'</span><span class="sc-diff-val neutral">'+f(after)+' (no change)</span></div>';
  var pos=invertGood?delta<0:delta>0;
  var cls=pos?'pos':'neg';var sign=delta>0?'+':'';
  return'<div class="sc-diff-row"><span class="sc-diff-lbl">'+label+'</span><span class="sc-diff-val '+cls+'">'+f(after)+' ('+sign+f(delta)+')</span></div>';
}

async function loadWishlist(){
  try{
    var r=await fetch(SUPA_URL+'/rest/v1/wishlist_items?select=*&order=created_at.asc',{headers:SUPA_H});
    if(r.ok){
      wishlistData=await r.json();
      wishlistLoaded=true;
      if(wishlistData.length===0)await seedWishlist();
      else renderApp();
    }
  }catch(e){console.error('loadWishlist:',e);}
}
async function seedWishlist(){
  try{
    var rows=WISHLIST_SEED.map(function(item){return{title:item.title,notes:item.notes,phase:item.phase,status:item.status,priority:0};});
    var r=await fetch(SUPA_URL+'/rest/v1/wishlist_items',{method:'POST',headers:Object.assign({},SUPA_H,{'Prefer':'return=representation'}),body:JSON.stringify(rows)});
    if(r.ok){wishlistData=await r.json();wishlistLoaded=true;renderApp();}
  }catch(e){console.error('seedWishlist:',e);}
}
async function saveWishlistItem(item){
  try{
    if(item.id){
      await fetch(SUPA_URL+'/rest/v1/wishlist_items?id=eq.'+item.id,{method:'PATCH',headers:Object.assign({},SUPA_H,{'Prefer':'return=minimal'}),body:JSON.stringify({title:item.title,notes:item.notes,phase:item.phase,status:item.status,updated_at:new Date().toISOString()})});
      var idx=wishlistData.findIndex(function(x){return x.id===item.id;});
      if(idx>=0)wishlistData[idx]=Object.assign({},wishlistData[idx],item);
    }else{
      var r=await fetch(SUPA_URL+'/rest/v1/wishlist_items',{method:'POST',headers:Object.assign({},SUPA_H,{'Prefer':'return=representation'}),body:JSON.stringify({title:item.title,notes:item.notes||'',phase:item.phase||'Backlog',status:'idea',priority:0})});
      if(r.ok){var created=await r.json();wishlistData=wishlistData.concat(created);}
    }
    wishlistAddOpen=false;wishlistEditId=null;renderApp();
  }catch(e){console.error('saveWishlistItem:',e);alert('Error saving: '+e.message);}
}
async function deleteWishlistItem(id){
  if(!confirm('Delete this item?'))return;
  try{
    await fetch(SUPA_URL+'/rest/v1/wishlist_items?id=eq.'+id,{method:'DELETE',headers:SUPA_H});
    wishlistData=wishlistData.filter(function(x){return x.id!==id;});
    renderApp();
  }catch(e){console.error('deleteWishlistItem:',e);}
}
async function moveWishlistItem(id,newStatus){
  var item=wishlistData.find(function(x){return x.id===id;});
  if(!item)return;
  var upd={status:newStatus,updated_at:new Date().toISOString()};
  if(newStatus==='done')upd.completed_at=new Date().toISOString();
  try{
    await fetch(SUPA_URL+'/rest/v1/wishlist_items?id=eq.'+id,{method:'PATCH',headers:Object.assign({},SUPA_H,{'Prefer':'return=minimal'}),body:JSON.stringify(upd)});
    var idx=wishlistData.findIndex(function(x){return x.id===id;});
    if(idx>=0)wishlistData[idx]=Object.assign({},wishlistData[idx],upd);
    renderApp();
  }catch(e){console.error('moveWishlistItem:',e);}
}
