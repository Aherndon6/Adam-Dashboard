async function loadWishlist(){
  try{
    var r=await fetch(SUPA_URL+'/rest/v1/wishlist_items?select=*&order=created_at.asc',{headers:SUPA_H});
    if(r.ok){
      wishlistData=await r.json();
      wishlistLoaded=true;
      if(wishlistData.length===0)await seedWishlist();
      else await mergeSeedWishlist();
    }
  }catch(e){console.error('loadWishlist:',e);}
}
async function mergeSeedWishlist(){
  // Add any WISHLIST_SEED items not already present (matched by title)
  var existing=wishlistData.map(function(x){return x.title;});
  var missing=WISHLIST_SEED.filter(function(s){return existing.indexOf(s.title)<0;});
  if(missing.length){
    try{
      var rows=missing.map(function(item){return{title:item.title,notes:item.notes,phase:item.phase,status:item.status,priority:0};});
      var r=await fetch(SUPA_URL+'/rest/v1/wishlist_items',{method:'POST',headers:Object.assign({},SUPA_H,{'Prefer':'return=representation'}),body:JSON.stringify(rows)});
      if(r.ok){var added=await r.json();wishlistData=wishlistData.concat(added);console.log('Wishlist: merged '+added.length+' new seed items.');}
    }catch(e){console.warn('mergeSeedWishlist:',e);}
  }
  await phaseMigrateWishlist();
  renderApp();
}
async function phaseMigrateWishlist(){
  // 1. Bulk-move ALL remaining Phase 4 planned items to Phase 5.
  //    Catches any items added by the user or seeded before the re-phase decision.
  var phase4planned=wishlistData.filter(function(x){return x.phase==='Phase 4'&&x.status==='planned';});
  for(var i=0;i<phase4planned.length;i++){
    var item=phase4planned[i];
    try{
      await fetch(SUPA_URL+'/rest/v1/wishlist_items?id=eq.'+item.id,{method:'PATCH',headers:Object.assign({},SUPA_H,{'Prefer':'return=minimal'}),body:JSON.stringify({phase:'Phase 5'})});
      item.phase='Phase 5';
      console.log('Wishlist phase migration: "'+item.title+'" Phase 4 planned → Phase 5');
    }catch(e){console.warn('phaseMigrate error:',e);}
  }
  // 2. Title-based corrections for items seeded with wrong phases from older code.
  var corrections=[
    {title:'Dynamic goal registry',          phase:'Phase 5'},
    {title:'Dynamic goal registry (CRUD)',    phase:'Phase 5'},
    {title:'Goal dependency chain',           phase:'Phase 5'},
    {title:'Goal progress from actions',      phase:'Phase 5'},
    {title:'Authentication',                  phase:'Phase 6'},
  ];
  for(var j=0;j<corrections.length;j++){
    var c=corrections[j];
    var match=wishlistData.find(function(x){return x.title===c.title;});
    if(match&&match.phase!==c.phase){
      try{
        await fetch(SUPA_URL+'/rest/v1/wishlist_items?id=eq.'+match.id,{method:'PATCH',headers:Object.assign({},SUPA_H,{'Prefer':'return=minimal'}),body:JSON.stringify({phase:c.phase})});
        match.phase=c.phase;
        console.log('Wishlist phase migration: "'+match.title+'" → '+c.phase);
      }catch(e){console.warn('phaseMigrate error:',e);}
    }
  }
}
async function seedWishlist(){
  try{
    var rows=WISHLIST_SEED.map(function(item){return{title:item.title,notes:item.notes,phase:item.phase,status:item.status,priority:0};});
    var r=await fetch(SUPA_URL+'/rest/v1/wishlist_items',{method:'POST',headers:Object.assign({},SUPA_H,{'Prefer':'return=representation'}),body:JSON.stringify(rows)});
    if(r.ok){wishlistData=await r.json();wishlistLoaded=true;renderApp();}
  }catch(e){console.error('seedWishlist:',e);}
}
async function saveWishlistItem(item){
  try{
    if(item.id){
      await fetch(SUPA_URL+'/rest/v1/wishlist_items?id=eq.'+item.id,{method:'PATCH',headers:Object.assign({},SUPA_H,{'Prefer':'return=minimal'}),body:JSON.stringify({title:item.title,notes:item.notes,phase:item.phase,status:item.status,updated_at:new Date().toISOString()})});
      var idx=wishlistData.findIndex(function(x){return x.id===item.id;});
      if(idx>=0)wishlistData[idx]=Object.assign({},wishlistData[idx],item);
    }else{
      var r=await fetch(SUPA_URL+'/rest/v1/wishlist_items',{method:'POST',headers:Object.assign({},SUPA_H,{'Prefer':'return=representation'}),body:JSON.stringify({title:item.title,notes:item.notes||'',phase:item.phase||'Backlog',status:'idea',priority:0})});
      if(r.ok){var created=await r.json();wishlistData=wishlistData.concat(created);}
    }
    wishlistAddOpen=false;wishlistEditId=null;renderApp();
  }catch(e){console.error('saveWishlistItem:',e);alert('Error saving: '+e.message);}
}
async function deleteWishlistItem(id){
  if(!confirm('Delete this item?'))return;
  try{
    await fetch(SUPA_URL+'/rest/v1/wishlist_items?id=eq.'+id,{method:'DELETE',headers:SUPA_H});
    wishlistData=wishlistData.filter(function(x){return x.id!==id;});
    renderApp();
  }catch(e){console.error('deleteWishlistItem:',e);}
}
async function moveWishlistItem(id,newStatus){
  var item=wishlistData.find(function(x){return x.id===id;});
  if(!item)return;
  var upd={status:newStatus,updated_at:new Date().toISOString()};
  if(newStatus==='done')upd.completed_at=new Date().toISOString();
  try{
    await fetch(SUPA_URL+'/rest/v1/wishlist_items?id=eq.'+id,{method:'PATCH',headers:Object.assign({},SUPA_H,{'Prefer':'return=minimal'}),body:JSON.stringify(upd)});
    var idx=wishlistData.findIndex(function(x){return x.id===id;});
    if(idx>=0)wishlistData[idx]=Object.assign({},wishlistData[idx],upd);
    renderApp();
  }catch(e){console.error('moveWishlistItem:',e);}
}

function renderRoadmap(){
  var el=document.getElementById('roadmap-content');if(!el)return;
  if(!wishlistLoaded){
    el.innerHTML='<div class="wl-header-bar"><div class="wl-page-title">Feature Wishlist</div><div class="wl-page-sub">Loading...</div></div>';
    if(!wishlistLoaded)loadWishlist();
    return;
  }
  var PHASES=['Backlog','Phase 3','Phase 4','Phase 5','Phase 6'];
  function phaseColor(p){var m={'Phase 1':'#64748b','Phase 2':'#2563eb','Phase 3':'#7c3aed','Phase 4':'#db2777','Phase 5':'#ea580c','Phase 6':'#0d9488','Backlog':'#94a3b8'};return m[p]||'#94a3b8';}
  function card(item,canEdit){
    var c=phaseColor(item.phase);
    var isEditing=wishlistEditId===item.id;
    if(isEditing)return editForm(item);
    return'<div class="wl-card">'+
      '<div class="wl-card-title">'+_esc(item.title)+'</div>'+
      (item.notes?'<div class="wl-card-notes">'+_esc(item.notes)+'</div>':'')+
      '<div class="wl-card-footer"><span class="wl-phase-tag" style="background:'+c+'18;color:'+c+';border-color:'+c+'44">'+(item.phase||'Backlog')+'</span></div>'+
      (canEdit?'<div class="wl-card-actions">'+
        (item.status==='idea'?'<button class="wl-move-btn" onclick="moveWishlistItem('+item.id+',\'planned\')">→ Planned</button>':'')+''+
        (item.status==='planned'?'<button class="wl-move-btn" onclick="moveWishlistItem('+item.id+',\'idea\')">← Idea</button><button class="wl-move-btn" onclick="moveWishlistItem('+item.id+',\'done\')">✓ Done</button>':'')+''+
        '<button class="wl-move-btn" onclick="wishlistEditId='+item.id+';renderApp()">Edit</button>'+
        '<button class="wl-del-btn" onclick="deleteWishlistItem('+item.id+')">Delete</button>'+
      '</div>':'')+'</div>';
  }
  function editForm(item){
    var pOpts=PHASES.map(function(ph){return'<option value="'+ph+'"'+(item.phase===ph?' selected':'')+'>'+ph+'</option>';}).join('');
    return'<div class="wl-add-form">'+
      '<div class="wl-add-form-title">Edit item</div>'+
      '<input id="wl-edit-title" type="text" placeholder="Title" value="'+_esc(item.title||'')+'" style="margin-bottom:5px">'+
      '<textarea id="wl-edit-notes" placeholder="Notes (optional)" style="margin-bottom:5px">'+_esc(item.notes||'')+'</textarea>'+
      '<select id="wl-edit-phase">'+pOpts+'</select>'+
      '<div class="wl-form-btns">'+
        '<button class="wl-save-btn" onclick="_saveEditForm('+item.id+')">Save</button>'+
        '<button class="wl-cancel-btn" onclick="wishlistEditId=null;renderApp()">Cancel</button>'+
      '</div>'+
    '</div>';
  }
  function addForm(){
    var pOpts=PHASES.map(function(ph){return'<option value="'+ph+'">'+ph+'</option>';}).join('');
    return'<div class="wl-add-form">'+
      '<div class="wl-add-form-title">New idea</div>'+
      '<input id="wl-new-title" type="text" placeholder="Title *">'+
      '<textarea id="wl-new-notes" placeholder="Notes (optional)"></textarea>'+
      '<select id="wl-new-phase">'+pOpts+'</select>'+
      '<div class="wl-form-btns">'+
        '<button class="wl-save-btn" onclick="_saveAddForm()">Add</button>'+
        '<button class="wl-cancel-btn" onclick="wishlistAddOpen=false;renderApp()">Cancel</button>'+
      '</div>'+
    '</div>';
  }
  var ideas=wishlistData.filter(function(i){return i.status==='idea';});
  var planned=wishlistData.filter(function(i){return i.status==='planned';});
  var done=wishlistData.filter(function(i){return i.status==='done';});
  // Determine current and next phase from done items
  var donePhaseNums=done.map(function(i){return parseInt((i.phase||'').replace('Phase ',''))||0;});
  var currentPhaseNum=donePhaseNums.length?Math.max.apply(null,donePhaseNums):4;
  var nextPhaseLabel='Phase '+(currentPhaseNum+1);
  function plannedCol(items){
    // Group by phase, sorted by phase number
    var phaseNums={};
    items.forEach(function(it){phaseNums[it.phase||'Backlog']=parseInt((it.phase||'').replace('Phase ',''))||99;});
    var phases=[...new Set(items.map(function(i){return i.phase||'Backlog';}))].sort(function(a,b){return(phaseNums[a]||99)-(phaseNums[b]||99);});
    var body='';
    if(wishlistAddOpen)body+=addForm();
    if(!items.length){body+='<div class="wl-empty">Nothing planned yet</div>';}
    phases.forEach(function(ph){
      var phItems=items.filter(function(i){return(i.phase||'Backlog')===ph;});
      if(!phItems.length)return;
      var c=phaseColor(ph);
      var isNext=ph===nextPhaseLabel;
      var pill=isNext
        ?'<span style="background:'+c+'22;color:'+c+';border:1px solid '+c+'66;border-radius:99px;font-size:10px;font-weight:700;letter-spacing:.04em;padding:2px 9px">'+ph+' — Next ▶</span>'
        :'<span style="background:'+c+'18;color:'+c+';border:1px solid '+c+'44;border-radius:99px;font-size:10px;font-weight:700;letter-spacing:.04em;padding:2px 9px">'+ph+'</span>';
      body+='<div style="display:flex;align-items:center;gap:8px;margin:'+(body?'14px':'0')+'0 6px;'+(body?'border-top:1px solid var(--border);padding-top:12px':'')+'">'+pill+'<span style="flex:1;height:1px;background:var(--border)"></span><span style="font-size:10px;color:var(--muted)">'+phItems.length+' item'+(phItems.length!==1?'s':'')+'</span></div>';
      body+=phItems.map(function(it){return card(it,true);}).join('');
    });
    return'<div class="wl-col">'+
      '<div class="wl-col-header"><span class="wl-col-title">Planned</span><span class="wl-col-count">'+items.length+'</span>'+
      '<button class="wl-add-btn" onclick="wishlistAddOpen='+(wishlistAddOpen?'false':'true')+';wishlistEditId=null;renderApp()">'+(wishlistAddOpen?'✕':'+ Add')+'</button>'+
      '</div><div class="wl-col-body">'+body+'</div></div>';
  }
  function col(title,items,showAdd,canEdit,emptyMsg){
    return'<div class="wl-col">'+
      '<div class="wl-col-header"><span class="wl-col-title">'+title+'</span><span class="wl-col-count">'+items.length+'</span>'+
      (showAdd?'<button class="wl-add-btn" onclick="wishlistAddOpen='+(wishlistAddOpen?'false':'true')+';wishlistEditId=null;renderApp()">'+( wishlistAddOpen?'✕':'+ Add')+'</button>':'')+
      '</div>'+
      '<div class="wl-col-body">'+
        (showAdd&&wishlistAddOpen?addForm():'')+
        (items.length?items.map(function(it){return card(it,canEdit);}).join(''):('<div class="wl-empty">'+emptyMsg+'</div>'))+
      '</div>'+
    '</div>';
  }
  var html='<div class="wl-header-bar"><div class="wl-page-title">Feature Wishlist</div><div class="wl-page-sub">Source of truth for what has been built, what is coming, and what is on your mind. Claude reads this list for phase planning.</div></div>'+
  '<div class="wl-board">'+
    col('Ideas',ideas,true,true,'No ideas yet — click Add to capture one')+
    plannedCol(planned)+
    col('Done',done,false,false,'Nothing done yet')+
  '</div>';
  el.innerHTML=html;
}

}
function _saveEditForm(id){
  var t=document.getElementById('wl-edit-title');var n=document.getElementById('wl-edit-notes');var p=document.getElementById('wl-edit-phase');

  var item=wishlistData.find(function(x){return x.id===id;});
  if(!item)return;
  saveWishlistItem(Object.assign({},item,{title:t.value.trim(),notes:n?n.value.trim():item.notes,phase:p?p.value:item.phase}));
}

  lines.push('  Breakdown: $103.64 current AMEX (incl $3.89 interest) + $3,772.74 savings seed + $3,818.49 checking rebuild = $7,694.87');
  lines.push('  Funded: '+(retDone?'Cal Wk '+getCalWeek(retDone.num)+' ('+retDone.dates+')':'Not fully funded within model'));
  lines.push('Surplus after goals: '+f(curW.surplusSwept)+' accumulated | End-of-model projected: '+f(w31.surplusSwept));
  lines.push('  Surplus begins: '+(surplusStart?'Cal Wk '+getCalWeek(surplusStart.num)+' ('+surplusStart.dates+')':'After retirement funded'));
  lines.push('  Note: surplus stays in Truist Checking — earmarked but not swept until Phase 4');
  lines.push('');
  lines.push('=== RECONCILIATION ===');
  lines.push('Last reconciled: '+(maxRecon?'Cal Wk '+getCalWeek(maxRecon)+' (Model Wk '+maxRecon+')':'Not yet reconciled'));
  lines.push('');
  lines.push('=== ALL 31 WEEKS ===');
  lines.push('Format: Cal Wk | Dates | Events (IN/OUT) | Actions (TODO/DONE) | End balances | Goals progress');
  lines.push('');
  weeks.forEach(function(w){
    var calWk=getCalWeek(w.num);
    var isNow=w.num===currentW;
    lines.push('--- Cal Wk '+calWk+(isNow?' [CURRENT WEEK]':'')+' | Model Wk '+w.num+' | '+w.dates+' ---');
    if(w.calNote)lines.push('  ⚠ NOTE: '+w.calNote);
    // Events
    if(w.evs&&w.evs.length){
      w.evs.forEach(function(e){lines.push('  '+(e.t==='in'?'IN ':'OUT')+' '+e.l+': '+f(Math.abs(e.a)));});
    }else{lines.push('  No events');}
    // Actions with completion status
    if(w.ac&&w.ac.length){
      var realActs=w.ac.filter(function(a){return!a.includes('No transfers');});
      if(realActs.length){
        realActs.forEach(function(a,i){
          var done=taskData[w.num+'_'+i]&&taskData[w.num+'_'+i].completed;
          lines.push('  ACTION ['+(done?'DONE':'TODO')+']: '+a);
        });
      }
    }
    // End balances
    lines.push('  End balances: Chk='+f(w.chk)+' | Sav='+f(w.sav)+' | AMEX='+f(w.amx)+' | Tax='+f(w.tax)+' | LC='+f(w.lc));
    // Reconciliation actuals
    if(w.reconciled&&w.actualBals){
      lines.push('  RECONCILED — Actual: Chk='+f(w.actualBals.chk)+' Sav='+f(w.actualBals.sav)+' | Chk variance: '+f(w.variance.chk));
    }
    // Goals progress
    lines.push('  Goals: AK saved='+f(w.akSaved)+' AK rem='+f(w.akRem)+' | Ret rem='+f(w.retRem)+' | Surplus='+f(w.surplusSwept));
    lines.push('');
  });
  return lines.join('\n');
}
async function sendAsk(){
  var inputEl=document.getElementById('ask-input');
  var q=inputEl?inputEl.value.trim():'';
  if(!q||!anthropicKey||askLoading)return;
  askMessages.push({role:'user',content:q});
  askLoading=true;if(inputEl)inputEl.value='';
  renderAskClaude();
  try{
    var ctx=_buildModelContext();
    var msgs=askMessages.slice(0,-1).concat([{role:'user',content:q}]);
    // Build full messages with system context embedded in first user message
    var apiMsgs=msgs.map(function(m,i){
      if(i===0&&m.role==='user'){return{role:'user',content:'You are a financial assistant embedded in the Herndon Financial OS — Adam Herndon\'s personal cash flow dashboard for Jun 2026–Jan 2027. You have full access to all 31 weeks of the model including every event, action item, account balance, goal, and reconciliation status. Answer any question about the model concisely and specifically. Use calendar week numbers (Cal Wk) not model week numbers when referring to weeks. Never suggest modifying the model.\n\n'+ctx+'\n\nQuestion: '+m.content};}
      return{role:m.role,content:m.content};
    });
    var res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'x-api-key':anthropicKey,'anthropic-version':'2023-06-01','content-type':'application/json','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:1024,messages:apiMsgs})
    });
    if(!res.ok){var err=await res.json();throw new Error(err.error&&err.error.message||'API error '+res.status);}
    var data=await res.json();
    var reply=data.content&&data.content[0]&&data.content[0].text||'No response.';
    askMessages.push({role:'assistant',content:reply});
  }catch(e){
    console.error('sendAsk:',e);
    askMessages.push({role:'assistant',content:'Error: '+e.message});
  }
  askLoading=false;renderAskClaude();
}

// Render immediately with defaults so the page isn't blank while Supabase loads
try{
  renderApp();
}catch(e){
  console.error('Initial render error:',e);
  // Surface error visibly in the content area for debugging
  var dbgEl=document.getElementById('overview-content');
  if(dbgEl)dbgEl.innerHTML='<div style="padding:24px;color:#b91c1c;font-family:monospace;font-size:13px;background:#fef2f2;border-radius:8px;margin:16px"><strong>Render error:</strong><br>'+e.message+'<br><pre style="margin-top:8px;white-space:pre-wrap;font-size:11px">'+e.stack+'</pre></div>';
}

loadAll();
