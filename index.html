  var t=document.getElementById('wl-new-title');var n=document.getElementById('wl-new-notes');var p=document.getElementById('wl-new-phase');
  if(!t||!t.value.trim())return;
  saveWishlistItem({title:t.value.trim(),notes:n?n.value.trim():'',phase:p?p.value:'Backlog'});
}
function _saveEditForm(id){
  var t=document.getElementById('wl-edit-title');var n=document.getElementById('wl-edit-notes');var p=document.getElementById('wl-edit-phase');
  if(!t||!t.value.trim())return;
  var item=wishlistData.find(function(x){return x.id===id;});
  if(!item)return;
  saveWishlistItem(Object.assign({},item,{title:t.value.trim(),notes:n?n.value.trim():item.notes,phase:p?p.value:item.phase}));
}

// ── AI Q&A ─────────────────────────────────────────────────────────────────
async function saveApiKey(key){
  if(!key||!key.trim())return;
  anthropicKey=key.trim();
  try{
    await fetch(SUPA_URL+'/rest/v1/goals',{method:'POST',headers:Object.assign({},SUPA_H,{'Prefer':'resolution=merge-duplicates,return=minimal'}),body:JSON.stringify({key:'anthropic_key',value:anthropicKey})});
  }catch(e){console.error('saveApiKey:',e);}
  renderApp();
}
function renderAskClaude(){
  var el=document.getElementById('ask-content');if(!el)return;
  var html='<div class="ask-page">';
  if(!anthropicKey){
    html+='<div class="ask-setup-card">'+
      '<h3>Connect your Anthropic API key</h3>'+
      '<p>Paste your API key from <strong>console.anthropic.com</strong> → API Keys. It will be stored in Supabase so it syncs across devices. Claude will only use it to answer questions about your model — it never modifies your data.</p>'+
      '<div class="ask-key-row">'+
        '<input class="ask-key-input" id="ask-key-field" type="password" placeholder="sk-ant-...">'+
        '<button class="ask-key-save" onclick="saveApiKey(document.getElementById(\'ask-key-field\').value)">Save key</button>'+
      '</div>'+
    '</div>';
  }else{
    html+='<div class="ask-setup-card" style="padding:10px 14px;display:flex;align-items:center;justify-content:space-between">'+
      '<span class="ask-key-status">✓ API key connected</span>'+
      '<button class="wl-cancel-btn" onclick="anthropicKey=\'\';renderApp()" style="font-size:11px">Change key</button>'+
    '</div>';
  }
  // Chat area
  html+='<div class="ask-chat-area" id="ask-chat-area">';
  if(askMessages.length===0){
    html+='<div class="ask-empty">Ask anything about your financial model.<br>Examples: "When do I finish Alaska?" · "What\'s my worst cash week?" · "How much goes to taxes by end of year?"</div>';
  }else{
    askMessages.forEach(function(m){html+='<div class="ask-msg '+m.role+'">'+_esc(m.content)+'</div>';});
    if(askLoading)html+='<div class="ask-msg thinking">Thinking...</div>';
  }
  html+='</div>';
  // Input row
  html+='<div class="ask-input-row">'+
    '<textarea class="ask-input" id="ask-input" rows="2" placeholder="Ask a question..." onkeydown="if(event.key===\'Enter\'&&!event.shiftKey){event.preventDefault();sendAsk();}"></textarea>'+
    '<button class="ask-send-btn" onclick="sendAsk()" '+(askLoading||!anthropicKey?'disabled':'')+'>Send</button>'+
  '</div>'+
  '<div class="ask-footer-note">Read-only · never modifies your model · key stored encrypted in Supabase</div>';
  html+='</div>';
  el.innerHTML=html;
  // Scroll to bottom
  var ca=document.getElementById('ask-chat-area');if(ca)ca.scrollTop=ca.scrollHeight;
}
function _buildModelContext(){
  var g=getGoals();var weeks=runModel(g.ak,g.rt);
  var reconned=Object.keys(reconData).map(Number).filter(function(n){return reconData[n]&&reconData[n].chk!==undefined;});
  var maxRecon=reconned.length?Math.max.apply(null,reconned):0;
  var akDone=weeks.find(function(w){return w.akRem<=0.01;});
  var troughs=weeks.filter(function(w){return w.trough;}).map(function(w){return'Wk '+getCalWeek(w.num)+' ('+getWeekDate(w.num)+')';});
  var managed=weeks.filter(function(w){return w.managed;}).map(function(w){return'Wk '+getCalWeek(w.num)+'('+getWeekDate(w.num)+')';});
  var wkSummaries=weeks.slice(0,10).map(function(w){return'Wk '+getCalWeek(w.num)+': Chk='+f(w.chk)+' Sav='+f(w.sav)+' LC='+f(w.lc)+' akRem='+f(w.akRem)+' retRem='+f(w.retRem);}).join('\n');
  var w31=weeks[30];
  return'Herndon Financial OS — model context as of today ('+new Date().toLocaleDateString()+')\n'+
    'Current model week: '+currentW+' (Calendar Wk '+getCalWeek(currentW)+', '+getWeekDate(currentW)+')\n'+
    'Alaska goal: $'+f(g.ak)+' remaining: $'+f((weeks.find(function(w){return w.num===currentW;})||weeks[0]).akRem)+'\n'+
    'Retirement goal: $'+f(g.rt)+' remaining at Wk 31: $'+f(w31.retRem)+'\n'+
    'Alaska completes: '+(akDone?'Wk '+getCalWeek(akDone.num)+' ('+getWeekDate(akDone.num)+')':'Not within 31-week model')+'\n'+
    'Trough weeks: '+troughs.join(', ')+'\n'+
    'Managed weeks: '+managed.join(', ')+'\n'+
    'Last reconciled: Wk '+(maxRecon?getCalWeek(maxRecon):' — not yet')+'\n'+
    'Week 31 balances: Chk='+f(w31.chk)+' Sav='+f(w31.sav)+' AMEX='+f(w31.amx)+' Tax='+f(w31.tax)+' LC='+f(w31.lc)+'\n'+
    'First 10 weeks:\n'+wkSummaries;
}
async function sendAsk(){
  var inputEl=document.getElementById('ask-input');
  var q=inputEl?inputEl.value.trim():'';
  if(!q||!anthropicKey||askLoading)return;
  askMessages.push({role:'user',content:q});
  askLoading=true;if(inputEl)inputEl.value='';
  renderAskClaude();
  try{
    var ctx=_buildModelContext();
    var msgs=askMessages.slice(0,-1).concat([{role:'user',content:q}]);
    // Build full messages with system context embedded in first user message
    var apiMsgs=msgs.map(function(m,i){
      if(i===0&&m.role==='user'){return{role:'user',content:'You are a financial dashboard assistant for Adam Herndon\'s personal cash flow model. Answer questions based only on the model data below. Be concise and specific. Never suggest modifying the model.\n\n'+ctx+'\n\nQuestion: '+m.content};}
      return{role:m.role,content:m.content};
    });
    var res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'x-api-key':anthropicKey,'anthropic-version':'2023-06-01','content-type':'application/json','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:512,messages:apiMsgs})
    });
    if(!res.ok){var err=await res.json();throw new Error(err.error&&err.error.message||'API error '+res.status);}
    var data=await res.json();
    var reply=data.content&&data.content[0]&&data.content[0].text||'No response.';
    askMessages.push({role:'assistant',content:reply});
  }catch(e){
    console.error('sendAsk:',e);
    askMessages.push({role:'assistant',content:'Error: '+e.message});
  }
  askLoading=false;renderAskClaude();
}

// Render immediately with defaults so the page isn't blank while Supabase loads
try{
  renderApp();
}catch(e){
  console.error('Initial render error:',e);
  // Surface error visibly in the content area for debugging
  var dbgEl=document.getElementById('overview-content');
  if(dbgEl)dbgEl.innerHTML='<div style="padding:24px;color:#b91c1c;font-family:monospace;font-size:13px;background:#fef2f2;border-radius:8px;margin:16px"><strong>Render error:</strong><br>'+e.message+'<br><pre style="margin-top:8px;white-space:pre-wrap;font-size:11px">'+e.stack+'</pre></div>';
}
// Then load persisted data and re-render
loadAll();
